version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  # Rust/Cargo - workspace root
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor:
        update-types:
          - "minor"
          - "patch"

  # npm - Root (eslint deps)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  # npm - TypeScript library
  - package-ecosystem: "npm"
    directory: "/libs/ic_siwa_ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  # npm - Test canister frontend
  - package-ecosystem: "npm"
    directory: "/canisters/test_canister_ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

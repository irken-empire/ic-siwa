---
##################################################
# Name: deploy-testnet.yml
# Description: Deploy to IC Mainnet (Avalanche Fuji Testnet config)
##################################################

name: Deploy Testnet

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  DFX_NETWORK: ic
  NIXPKGS_ALLOW_UNFREE: 1

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Wait for build workflow
  ##################################################
  wait-for-build:
    name: Wait for Build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for build workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Report Status"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  ##################################################
  # Build all canisters
  ##################################################
  build:
    name: Build ${{ matrix.canister }}
    needs: wait-for-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}
          provider_canister_id: ${{ secrets.IC_SIWA_PROVIDER_CANISTER_ID_TESTNET }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.canister }}-testnet
          path: ${{ matrix.type == 'rust' && format('target/wasm32-unknown-unknown/release/{0}.wasm', matrix.canister) || format('canisters/{0}/dist/', matrix.canister) }}
          retention-days: 7

  ##################################################
  # Deploy ic_siwa_provider
  ##################################################
  deploy-provider:
    name: Deploy Provider
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Testnet
    outputs:
      canister_id: ${{ steps.deploy.outputs.canister_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-testnet
          path: target/wasm32-unknown-unknown/release/

      - name: Deploy canister
        id: deploy
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          network: ic
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          init_args: |
            (record {
              domain = "${{ secrets.IC_SIWA_DOMAIN_TESTNET }}";
              uri = "${{ secrets.IC_SIWA_URI_TESTNET }}";
              salt = "${{ secrets.IC_SIWA_SALT_TESTNET }}";
              chain_id = 43113 : nat64;
              session_expiration_time = 1800000000000 : nat64;
              allowed_domains = opt vec {};
              allowed_canisters = opt vec {};
            })

  ##################################################
  # Verify deployment
  ##################################################
  verify:
    name: Verify
    needs: deploy-provider
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          network: ic
          canister_id: ${{ needs.deploy-provider.outputs.canister_id }}

  ##################################################
  # Deploy test canisters (optional)
  ##################################################
  deploy-test-canisters:
    name: Deploy Test Canisters
    needs: [deploy-provider, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Testnet
    if: vars.DEPLOY_TEST_CANISTERS == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download test_canister_rs
        uses: actions/download-artifact@v4
        with:
          name: test_canister_rs-testnet
          path: target/wasm32-unknown-unknown/release/

      - name: Download test_canister_ts
        uses: actions/download-artifact@v4
        with:
          name: test_canister_ts-testnet
          path: canisters/test_canister_ts/dist/

      - name: Deploy test_canister_rs
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_rs
          network: ic
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}

      - name: Deploy test_canister_ts
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_ts
          network: ic
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}

  ##################################################
  # Create draft release
  ##################################################
  draft-release:
    name: Draft Release
    needs: [verify, deploy-provider]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          echo "VERSION=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}-testnet
          name: "${{ steps.version.outputs.VERSION }} (Testnet)"
          body: |
            ## IC-SIWA Testnet Release

            | Property | Value |
            |----------|-------|
            | **Network** | IC Mainnet |
            | **Avalanche Chain** | Fuji Testnet (43113) |
            | **Canister ID** | `${{ needs.deploy-provider.outputs.canister_id }}` |
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

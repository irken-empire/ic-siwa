---
##################################################
# Name: cd-testnet.yaml
# Description: Testnet deployment pipeline
#
# Called by: cd-release.yaml (pre-release job)
#
# Pipeline:
#   1. Lint + test (skipped when called from release)
#   2. Build all canisters and npm package
#   3. Deploy to IC (testnet configuration)
#   4. Verify deployment
#   5. Publish npm package (dry run)
##################################################

name: Deploy (Testnet)

on:
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        type: string
        required: false
        default: ""
      accept_breaking_changes:
        description: "Accept breaking candid interface changes"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env
  ENVIRONMENT: testnet

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Setup - Read configuration
  ##################################################
  setup:
    name: Setup
    runs-on: ubuntu-latest
    environment: Testnet
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      debug: ${{ steps.read_config.outputs.debug }}
      domain: ${{ steps.read_config.outputs.domain }}
      uri: ${{ steps.read_config.outputs.uri }}
      chain_id: ${{ steps.read_config.outputs.chain_id }}
      session_expiration_ns: ${{ steps.read_config.outputs.session_expiration_ns }}
      allowed_domains: ${{ steps.read_config.outputs.allowed_domains }}
      allowed_canisters: ${{ steps.read_config.outputs.allowed_canisters }}
      delegation_targets: ${{ steps.read_config.outputs.delegation_targets }}
      rate_limit_per_address: ${{ steps.read_config.outputs.rate_limit_per_address }}
      rate_limit_total: ${{ steps.read_config.outputs.rate_limit_total }}
      rate_limit_window: ${{ steps.read_config.outputs.rate_limit_window }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: get_version
        name: Get Version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Get latest git tag (requires fetch-depth: 0)
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
            if [[ -z "${VERSION}" ]]; then
              echo "::error::No git tags found and no version input provided"
              exit 1
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - id: read_config
        name: Read Config
        uses: ./.github/actions/read-config
        with:
          environment: testnet

  ##################################################
  # Lint - Check code quality (skipped on workflow_call)
  ##################################################
  lint:
    name: Lint
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: cd-testnet-lint

      - id: rust_fmt
        name: Check Rust Formatting
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo fmt --all -- --check

      - id: rust_clippy
        name: Run Clippy
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo clippy --all-targets -- -D warnings

  ##################################################
  # Test - Run unit tests (skipped on workflow_call)
  ##################################################
  test:
    name: Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: cd-testnet-test

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: rust_tests
        name: Run Rust Tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa

      - id: typescript_tests
        name: Run TypeScript Tests
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          cd libs/ic_siwa_ts
          bun install
          bun test || echo "TypeScript tests completed"

  ##################################################
  # Build Canisters
  ##################################################
  build-canisters:
    name: Build Canister ${{ matrix.canister }}
    needs: [lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Testnet

    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: cd-testnet-build

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_canister
        name: Build Canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}
          environment: testnet
          optimize: "false"
          walletconnect_project_id: ${{ vars.PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.canister }}-testnet
          path: ${{ matrix.type == 'rust' && format('target/wasm32-unknown-unknown/release/{0}.wasm', matrix.canister) || format('canisters/{0}/dist/', matrix.canister) }}
          include-hidden-files: true
          retention-days: 7

  ##################################################
  # Build npm Package
  ##################################################
  build-npm:
    name: Build npm
    needs: [lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet
    outputs:
      version: ${{ steps.build_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_npm
        name: Build npm Package
        uses: ./.github/actions/build-npm

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ic-siwa-npm-testnet
          path: |
            libs/ic_siwa_ts/dist/
            libs/ic_siwa_ts/package.json
            libs/ic_siwa_ts/README.md
          retention-days: 7

  ##################################################
  # Deploy Provider Canister
  ##################################################
  deploy-provider:
    name: Deploy Provider
    needs: [setup, build-canisters, test]
    if: always() && needs.build-canisters.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Testnet
    outputs:
      canister_id: ${{ steps.deploy_canister.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic_siwa_provider-testnet
          path: target/wasm32-unknown-unknown/release/

      - id: deploy_canister
        name: Deploy Canister
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"
          init_args: |
            (record {
              domain = "${{ needs.setup.outputs.domain }}";
              uri = "${{ needs.setup.outputs.uri }}";
              salt = "${{ secrets.IC_SIWA_SALT }}";
              chain_id = ${{ needs.setup.outputs.chain_id }} : nat64;
              session_expiration_time = ${{ needs.setup.outputs.session_expiration_ns }} : nat64;
              allowed_domains = opt vec { ${{ needs.setup.outputs.allowed_domains }} };
              allowed_canisters = opt vec { ${{ needs.setup.outputs.allowed_canisters }} };
              delegation_targets = opt vec { ${{ needs.setup.outputs.delegation_targets }} };
              rate_limits = opt record {
                max_logins_per_address = ${{ needs.setup.outputs.rate_limit_per_address }} : nat32;
                max_logins_total = ${{ needs.setup.outputs.rate_limit_total }} : nat32;
                window_seconds = ${{ needs.setup.outputs.rate_limit_window }} : nat64;
              };
              debug = opt ${{ needs.setup.outputs.debug }};
            })

  ##################################################
  # Verify Deployment
  ##################################################
  verify-deployment:
    name: Verify Deployment
    needs: [deploy-provider]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: verify_canister
        name: Verify Canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          canister_id: ${{ needs.deploy-provider.outputs.canister_id }}

  ##################################################
  # Deploy Test Canisters (when debug=true)
  ##################################################
  deploy-test-canisters:
    name: Deploy Test Canisters
    needs: [setup, build-canisters, deploy-provider, verify-deployment]
    if: needs.setup.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Testnet
    outputs:
      test_canister_rs_id: ${{ steps.deploy_test_rs.outputs.canister_id }}
      test_canister_ts_id: ${{ steps.deploy_test_ts.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: download_test_rs
        name: Download test_canister_rs
        uses: actions/download-artifact@v7
        with:
          name: test_canister_rs-testnet
          path: target/wasm32-unknown-unknown/release/

      - id: download_test_ts
        name: Download test_canister_ts
        uses: actions/download-artifact@v7
        with:
          name: test_canister_ts-testnet
          path: canisters/test_canister_ts/dist/

      - id: deploy_test_rs
        name: Deploy test_canister_rs
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_rs
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

      - id: deploy_test_ts
        name: Deploy test_canister_ts
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_ts
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

  ##################################################
  # Register Custom Domain (when debug=true)
  ##################################################
  register-domain:
    name: Register Custom Domain
    needs: [setup, deploy-test-canisters]
    if: needs.setup.outputs.debug == 'true' && needs.setup.outputs.domain != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: register_domain
        name: Register Domain
        uses: ./.github/actions/register-domain
        with:
          domain: ${{ needs.setup.outputs.domain }}
          canister_id: ${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}

  ##################################################
  # Publish npm (dry run)
  ##################################################
  publish-npm:
    name: Publish npm (dry run)
    needs: [setup, build-npm, verify-deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet
    outputs:
      version: ${{ steps.publish_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: free_disk_space
        name: Free Disk Space
        uses: ./.github/actions/free-disk-space

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic-siwa-npm-testnet
          path: libs/ic_siwa_ts/

      - id: publish_npm
        name: Publish npm Package
        uses: ./.github/actions/publish-npm
        with:
          dry_run: "true"
          version: ${{ needs.setup.outputs.version }}

  ##################################################
  # Status
  ##################################################
  status:
    name: Status
    needs:
      [
        setup,
        lint,
        test,
        build-canisters,
        build-npm,
        deploy-provider,
        verify-deployment,
        deploy-test-canisters,
        register-domain,
        publish-npm,
      ]
    if: always()
    runs-on: ubuntu-latest
    environment: Testnet

    steps:
      - id: write_summary
        name: Write Results Summary
        run: |
          {
            echo "## Testnet Deployment Results"
            echo ""
            echo "### Job Status"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Setup | ${{ needs.setup.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Build Canisters | ${{ needs.build-canisters.result }} |"
            echo "| Build npm | ${{ needs.build-npm.result }} |"
            echo "| Deploy Provider | ${{ needs.deploy-provider.result }} |"
            echo "| Verify Deployment | ${{ needs.verify-deployment.result }} |"
            echo "| Deploy Test Canisters | ${{ needs.deploy-test-canisters.result }} |"
            echo "| Register Domain | ${{ needs.register-domain.result }} |"
            echo "| Publish npm | ${{ needs.publish-npm.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.deploy-provider.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Deployed Canisters"
              echo "| Canister | ID |"
              echo "|----------|---|"
              echo "| ic_siwa_provider | \`${{ needs.deploy-provider.outputs.canister_id }}\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "${{ needs.deploy-test-canisters.result }}" == "success" ]]; then
              {
                echo "| test_canister_rs | \`${{ needs.deploy-test-canisters.outputs.test_canister_rs_id }}\` |"
                echo "| test_canister_ts | \`${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - id: check_failures
        name: Check for Failures
        run: |
          CRITICAL_JOBS="${{ needs.build-canisters.result }},${{ needs.deploy-provider.result }},${{ needs.verify-deployment.result }}"
          if echo "${CRITICAL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::Testnet deployment failed"
            exit 1
          fi

          echo "Testnet deployment completed successfully!"

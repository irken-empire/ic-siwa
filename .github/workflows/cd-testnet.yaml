---
##################################################
# Name: cd-testnet.yaml
# Description: Testnet release pipeline
#
# Triggers:
#   - Manual dispatch
#
# Flow:
#   1. check-cache probes the Nix store cache key (lookup-only, ~5s).
#   2. setup-environment only runs on a cache miss (~60 min warm-up).
#   3. pre-release computes version via convco, creates a GitHub pre-release.
#   4. build-canisters + build-npm run in parallel.
#   5. deploy-provider deploys to IC testnet.
#   6. verify-deployment confirms the canister is live.
#   7. deploy-test-canisters + publish-npm (dry run) run conditionally.
##################################################

name: Release (Testnet)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: |
          Type "ship it" to confirm the Testnet release.
        required: true
        type: string
      version:
        description: >-
          Version override (e.g. v0.3.0 or 0.3.0).
          Overrides convco auto-bump. Leave blank for automatic versioning.
        required: false
        type: string
        default: ""
      accept_breaking_changes:
        description: "Accept breaking Candid interface changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  packages: read
  pull-requests: write
  statuses: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env
  ENVIRONMENT: testnet

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Gatekeeper - Check whether the Nix cache already exists
  ##################################################
  check-cache:
    name: Check Cache

    runs-on: ubuntu-latest

    timeout-minutes: 5
    continue-on-error: false

    outputs:
      cache-hit: ${{ steps.nix_cache_lookup.outputs.cache-hit }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: nix_cache_lookup
        name: Lookup Nix Cache
        uses: actions/cache@v5
        with:
          path: /nix
          key: ${{ runner.os }}-nix-${{ hashFiles('devenv.lock', 'devenv.nix') }}
          lookup-only: true

  ##################################################
  # Warm Cache - Only runs on a cache miss
  ##################################################
  setup-environment:
    name: Setup Environment

    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  ##################################################
  # Create a pre-release
  ##################################################
  pre-release:
    name: Pre-Release
    needs:
      - check-cache
      - setup-environment

    if: >-
      always() &&
      needs.check-cache.result == 'success'

    runs-on: ubuntu-latest
    environment: Testnet

    timeout-minutes: 120
    continue-on-error: false

    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      tag: ${{ steps.compute_version.outputs.tag }}
      skip: ${{ steps.compute_version.outputs.skip }}

    steps:
      - id: confirm_intent
        name: Confirm Intent
        run: |
          if [[ "${{ inputs.confirm }}" != "ship it" ]]; then
            echo "::error::Confirmation must be exactly \"ship it\". Got: \"${{ inputs.confirm }}\""
            exit 1
          fi
          echo "✅ Confirmation accepted"

      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: compute_version
        name: Compute Version
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          RAW_VERSION="${{ inputs.version }}"

          if [[ -n "${RAW_VERSION}" ]]; then
            # Normalize: strip leading 'v', then re-add for canonical form
            SEMVER="${RAW_VERSION#v}"
            if ! [[ "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
              echo "::error::Invalid version '${RAW_VERSION}'. Expected e.g. 1.2.3 or v1.2.3"
              exit 1
            fi
            NEXT_VERSION="${SEMVER}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          else
            # Auto-bump from conventional commits (accumulates all feat/fix since last tag)
            NEXT_VERSION=$(convco version --bump 2>/dev/null || echo "")
            if [[ -z "${NEXT_VERSION}" ]]; then
              echo "No bump-worthy commits found (e.g. chore). Skipping release."
              NEXT_VERSION=$(convco version)
              echo "skip=true" >> "${GITHUB_OUTPUT}"
            else
              echo "skip=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

          TAG="v${NEXT_VERSION}"

          # Guard: abort if this tag already exists on remote
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag '${TAG}' already exists on remote. Aborting to prevent overwrite."
            exit 1
          fi

          echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${NEXT_VERSION}, Tag: ${TAG}"

      - id: create_release
        name: Create Pre-Release
        if: steps.compute_version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.compute_version.outputs.tag }}"

          # Idempotent: reuse existing pre-release if already created
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Pre-release ${TAG} already exists, reusing for deployment"
          else
            gh release create "${TAG}" \
              --title "Pre-Release ${TAG}" \
              --notes "Release ${TAG}" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

      - id: generate_changelog
        name: Generate Changelog
        if: steps.compute_version.outputs.skip != 'true'
        shell: devenv shell --quiet bash -- -e {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.compute_version.outputs.tag }}"

          # Fetch the tag created by gh release so convco can see it
          git fetch --tags --force

          # Generate changelog for the latest version
          CHANGELOG=$(convco changelog --max-versions 1 --no-links 2>/dev/null || echo "Release ${TAG}")

          {
            echo "${CHANGELOG}"
            echo ""
            echo "---"
            echo ""
            echo "## :rocket: Testnet Deployment"
            echo ""
            echo "| Resource | ID |"
            echo "|----------|-----|"
            echo "| ic_siwa_provider | (see job output) |"
          } > /tmp/changelog.md

          # Update the release with the real changelog
          gh release edit "${TAG}" --notes-file /tmp/changelog.md

          echo "Updated release ${TAG} with changelog"

  ##################################################
  # Setup - Read configuration
  ##################################################
  setup:
    name: Setup
    needs:
      - pre-release
    if: >-
      always() &&
      needs.pre-release.result == 'success' &&
      needs.pre-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: Testnet
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      debug: ${{ steps.read_config.outputs.debug }}
      domain: ${{ steps.read_config.outputs.domain }}
      uri: ${{ steps.read_config.outputs.uri }}
      chain_id: ${{ steps.read_config.outputs.chain_id }}
      session_expiration_ns: ${{ steps.read_config.outputs.session_expiration_ns }}
      allowed_domains: ${{ steps.read_config.outputs.allowed_domains }}
      allowed_canisters: ${{ steps.read_config.outputs.allowed_canisters }}
      delegation_targets: ${{ steps.read_config.outputs.delegation_targets }}
      rate_limit_per_address: ${{ steps.read_config.outputs.rate_limit_per_address }}
      rate_limit_total: ${{ steps.read_config.outputs.rate_limit_total }}
      rate_limit_window: ${{ steps.read_config.outputs.rate_limit_window }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: get_version
        name: Get Version
        run: |
          echo "version=${{ needs.pre-release.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - id: read_config
        name: Read Config
        uses: ./.github/actions/read-config
        with:
          environment: testnet

  ##################################################
  # Build Canisters
  ##################################################
  build-canisters:
    name: Build Canister ${{ matrix.canister }}
    needs:
      - setup
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet

    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_canister
        name: Build Canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}
          environment: testnet
          optimize: "false"
          walletconnect_project_id: ${{ vars.PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.canister }}-testnet
          path: >-
            ${{ matrix.type == 'rust'
              && format('target/wasm32-unknown-unknown/release/{0}.wasm', matrix.canister)
              || format('canisters/{0}/dist/', matrix.canister) }}
          include-hidden-files: true
          retention-days: 7

  ##################################################
  # Build npm Package
  ##################################################
  build-npm:
    name: Build npm
    needs:
      - setup
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet
    outputs:
      version: ${{ steps.build_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_npm
        name: Build npm Package
        uses: ./.github/actions/build-npm

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ic-siwa-npm-testnet
          path: |
            libs/ic_siwa_ts/dist/
            libs/ic_siwa_ts/package.json
            libs/ic_siwa_ts/README.md
          retention-days: 7

  ##################################################
  # Deploy Provider Canister
  ##################################################
  deploy-provider:
    name: Deploy Provider
    needs:
      - setup
      - build-canisters
    if: always() && needs.build-canisters.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet
    outputs:
      canister_id: ${{ steps.deploy_canister.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic_siwa_provider-testnet
          path: target/wasm32-unknown-unknown/release/

      - id: deploy_canister
        name: Deploy Canister
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: ${{ inputs.accept_breaking_changes == true }}
          init_args: |
            (record {
              domain = "${{ needs.setup.outputs.domain }}";
              uri = "${{ needs.setup.outputs.uri }}";
              salt = "${{ secrets.IC_SIWA_SALT }}";
              chain_id = ${{ needs.setup.outputs.chain_id }} : nat64;
              session_expiration_time = ${{ needs.setup.outputs.session_expiration_ns }} : nat64;
              allowed_domains = opt vec { ${{ needs.setup.outputs.allowed_domains }} };
              allowed_canisters = opt vec { ${{ needs.setup.outputs.allowed_canisters }} };
              delegation_targets = opt vec { ${{ needs.setup.outputs.delegation_targets }} };
              rate_limits = opt record {
                max_logins_per_address = ${{ needs.setup.outputs.rate_limit_per_address }} : nat32;
                max_logins_total = ${{ needs.setup.outputs.rate_limit_total }} : nat32;
                window_seconds = ${{ needs.setup.outputs.rate_limit_window }} : nat64;
              };
              debug = opt ${{ needs.setup.outputs.debug }};
            })

  ##################################################
  # Verify Deployment
  ##################################################
  verify-deployment:
    name: Verify Deployment
    needs:
      - deploy-provider
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: verify_canister
        name: Verify Canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          canister_id: ${{ needs.deploy-provider.outputs.canister_id }}

  ##################################################
  # Deploy Test Canisters (when debug=true)
  ##################################################
  deploy-test-canisters:
    name: Deploy Test Canisters
    needs:
      - setup
      - build-canisters
      - deploy-provider
      - verify-deployment
    if: needs.setup.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet
    outputs:
      test_canister_rs_id: ${{ steps.deploy_test_rs.outputs.canister_id }}
      test_canister_ts_id: ${{ steps.deploy_test_ts.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - id: download_test_rs
        name: Download test_canister_rs
        uses: actions/download-artifact@v7
        with:
          name: test_canister_rs-testnet
          path: target/wasm32-unknown-unknown/release/

      - id: download_test_ts
        name: Download test_canister_ts
        uses: actions/download-artifact@v7
        with:
          name: test_canister_ts-testnet
          path: canisters/test_canister_ts/dist/

      - id: deploy_test_rs
        name: Deploy test_canister_rs
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_rs
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

      - id: deploy_test_ts
        name: Deploy test_canister_ts
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_ts
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

  ##################################################
  # Register Custom Domain (when debug=true)
  ##################################################
  register-domain:
    name: Register Custom Domain
    needs:
      - setup
      - deploy-test-canisters
    if: needs.setup.outputs.debug == 'true' && needs.setup.outputs.domain != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: register_domain
        name: Register Domain
        uses: ./.github/actions/register-domain
        with:
          domain: ${{ needs.setup.outputs.domain }}
          canister_id: ${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}

  ##################################################
  # Publish npm (dry run on testnet)
  ##################################################
  publish-npm:
    name: Publish npm (dry run)
    needs:
      - setup
      - build-npm
      - verify-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Testnet
    outputs:
      version: ${{ steps.publish_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic-siwa-npm-testnet
          path: libs/ic_siwa_ts/

      - id: publish_npm
        name: Publish npm Package
        uses: ./.github/actions/publish-npm
        with:
          dry_run: "true"
          version: ${{ needs.setup.outputs.version }}

  ##################################################
  # Status
  ##################################################
  status:
    name: Status
    needs:
      [
        pre-release,
        setup,
        build-canisters,
        build-npm,
        deploy-provider,
        verify-deployment,
        deploy-test-canisters,
        register-domain,
        publish-npm,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testnet

    steps:
      - id: write_summary
        name: Write Results Summary
        run: |
          {
            echo "## Testnet Release Results"
            echo ""
            echo "### Job Status"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Pre-Release | ${{ needs.pre-release.result }} |"
            echo "| Setup | ${{ needs.setup.result }} |"
            echo "| Build Canisters | ${{ needs.build-canisters.result }} |"
            echo "| Build npm | ${{ needs.build-npm.result }} |"
            echo "| Deploy Provider | ${{ needs.deploy-provider.result }} |"
            echo "| Verify Deployment | ${{ needs.verify-deployment.result }} |"
            echo "| Deploy Test Canisters | ${{ needs.deploy-test-canisters.result }} |"
            echo "| Register Domain | ${{ needs.register-domain.result }} |"
            echo "| Publish npm (dry run) | ${{ needs.publish-npm.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.pre-release.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Pre-Release"
              echo "**Tag**: \`${{ needs.pre-release.outputs.tag }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${{ needs.deploy-provider.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Deployed Canisters"
              echo "| Canister | ID |"
              echo "|----------|---|"
              echo "| ic_siwa_provider | \`${{ needs.deploy-provider.outputs.canister_id }}\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "${{ needs.deploy-test-canisters.result }}" == "success" ]]; then
              {
                echo "| test_canister_rs | \`${{ needs.deploy-test-canisters.outputs.test_canister_rs_id }}\` |"
                echo "| test_canister_ts | \`${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - id: check_failures
        name: Check for Failures
        run: |
          CRITICAL_JOBS="${{ needs.pre-release.result }},${{ needs.build-canisters.result }},${{ needs.deploy-provider.result }},${{ needs.verify-deployment.result }}"
          if echo "${CRITICAL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::Testnet release failed"
            exit 1
          fi

          echo "Testnet release completed successfully!"

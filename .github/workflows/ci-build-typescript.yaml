---
##################################################
# Name: ci-build-typescript.yaml
# Description: Builds TypeScript assets — the test canister frontend
#              and the ic-siwa npm package
#
# Matrix:
#   - assets  (test_canister_ts — Astro/Vite frontend canister)
#   - package (ic_siwa_ts — npm library distribution)
##################################################

name: CI Build TypeScript

on: workflow_call

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

jobs:
  build-typescript:
    name: CI Build TypeScript (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: assets
            canister: test_canister_ts
          - kind: package

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      ##################################################
      # Assets canister (test_canister_ts)
      ##################################################
      - id: build_assets
        name: Build Assets Canister
        if: matrix.kind == 'assets'
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: assets
          environment: development

      - id: upload_assets_artifact
        name: Upload Assets Artifact
        if: matrix.kind == 'assets'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.canister }}-ci
          path: canisters/${{ matrix.canister }}/dist/
          retention-days: 1

      ##################################################
      # npm package (ic_siwa_ts)
      ##################################################
      - id: build_npm
        name: Build npm Package
        if: matrix.kind == 'package'
        uses: ./.github/actions/build-npm

      - id: upload_npm_artifact
        name: Upload npm Artifact
        if: matrix.kind == 'package'
        uses: actions/upload-artifact@v7
        with:
          name: ic-siwa-npm-ci
          path: libs/ic_siwa_ts/
          retention-days: 1

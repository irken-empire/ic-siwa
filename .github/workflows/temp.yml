---
##################################################
# Name: temp.yml
# Description: Temporary workflow for testing canister verification
#
# Triggers:
#   - PR synchronize (push to PR branch)
#
# This is a temporary workflow for testing the verify-canister action.
# Delete this file once verification is working.
##################################################

name: Test Verification

on:
  pull_request:
    types: [synchronize, opened]

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Canister
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: testnet

      - name: Verify canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          canister_id: ejj2n-kqaaa-aaaad-qjlxq-cai

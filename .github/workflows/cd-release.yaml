---
##################################################
# Name: cd-release.yaml
# Description: Single entrypoint for all releases
#
# Triggers:
#   - Push to trunk → Create pre-release (automatic)
#   - Manual dispatch → Create pre-release (Testnet) or promote to release (Mainnet)
#
# Flow:
#   1. Compute next version via convco (or use version_override if provided)
#   2. Bump version in Cargo.toml, package.json files, TypeScript VERSION
#   3. Testnet: Tag as v{version}, create pre-release
#      → calls cd-testnet.yaml (workflow_call)
#   4. Mainnet: Promote existing pre-release tag to release
#      → calls cd-mainnet.yaml (workflow_call)
##################################################

name: Release

on:
  push:
    branches:
      - trunk

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - Testnet
          - Mainnet
        default: Testnet
      release_tag:
        description: "Tag to promote (Mainnet only, e.g. v0.2.0)"
        required: false
        type: string
        default: ""
      version_override:
        description: "Force a specific version (Testnet only, e.g. 0.3.0 or v0.3.0)"
        required: false
        type: string
        default: ""
      accept_breaking_changes:
        description: "Accept breaking candid interface changes (passed to deploy)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Create a pre-release
  # Triggers: push to trunk (auto) OR manual with Testnet
  ##################################################

  pre-release:
    name: Pre-Release

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'Testnet')

    runs-on: ubuntu-latest
    environment: Testnet

    timeout-minutes: 10
    continue-on-error: false

    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      tag: ${{ steps.compute_version.outputs.tag }}
      skip: ${{ steps.compute_version.outputs.skip }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: compute_version
        name: Compute Version
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          OVERRIDE="${{ github.event.inputs.version_override }}"

          if [[ -n "${OVERRIDE}" ]]; then
            # Strip leading 'v' if present and validate
            NEXT_VERSION="${OVERRIDE#v}"

            if ! [[ "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Invalid version format: '${OVERRIDE}'. Expected semver (e.g. 0.3.0 or v0.3.0)"
              exit 1
            fi

            echo "Using manual version override: ${NEXT_VERSION}"
          else
            # Get next version from conventional commits
            NEXT_VERSION=$(convco version --bump 2>/dev/null || echo "")

            if [[ -z "${NEXT_VERSION}" ]]; then
              echo "No conventional commits found to bump version"
              NEXT_VERSION=$(convco version)
            fi
          fi

          TAG="v${NEXT_VERSION}"

          # Check if tag already exists
          if git tag --list | grep -q "^${TAG}$"; then
            echo "Tag ${TAG} already exists, skipping release"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${NEXT_VERSION}, Tag: ${TAG}"

      - id: bump_version
        name: Bump Version Files
        if: steps.compute_version.outputs.skip != 'true'
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          ic-siwa version --force-set ${{ steps.compute_version.outputs.version }}

      - id: generate_changelog
        name: Generate Changelog
        if: steps.compute_version.outputs.skip != 'true'
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          # Generate changelog for unreleased commits
          CHANGELOG=$(convco changelog --unreleased 2>/dev/null || echo "No changelog available")
          # Write to file for the release step (multiline output)
          echo "${CHANGELOG}" > /tmp/changelog.md
          echo "Generated changelog for release"

      - id: create_release
        name: Create Pre-Release
        if: steps.compute_version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.compute_version.outputs.tag }}" \
            --title "Pre-Release ${{ steps.compute_version.outputs.tag }}" \
            --notes-file /tmp/changelog.md \
            --prerelease \
            --target "${{ github.sha }}"

  ##################################################
  # Deploy to Testnet
  # Calls cd-testnet.yaml via workflow_call
  ##################################################

  deploy-testnet:
    name: Deploy (Testnet)
    needs: pre-release
    if: needs.pre-release.outputs.skip != 'true'
    uses: ./.github/workflows/cd-testnet.yaml
    with:
      version: ${{ needs.pre-release.outputs.tag }}
      accept_breaking_changes: ${{ inputs.accept_breaking_changes == true }}
    secrets: inherit

  ##################################################
  # Promote a pre-release to release (mainnet)
  # Triggers: manual dispatch with Mainnet
  # Requires GitHub Environment "Mainnet" approvers
  ##################################################

  promote:
    name: Promote to Release (Mainnet)

    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'Mainnet'

    runs-on: ubuntu-latest
    environment: Mainnet

    timeout-minutes: 5
    continue-on-error: false

    outputs:
      tag: ${{ steps.validate_tag.outputs.tag }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: validate_tag
        name: Validate Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::release_tag is required for Mainnet promotion"
            exit 1
          fi

          # Verify the release exists and is a pre-release
          RELEASE_INFO=$(gh release view "${RELEASE_TAG}" --json isPrerelease,tagName 2>&1) || {
            echo "::error::Release '${RELEASE_TAG}' not found"
            exit 1
          }

          IS_PRERELEASE=$(echo "${RELEASE_INFO}" | jq -r '.isPrerelease')
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            echo "::error::Release '${RELEASE_TAG}' is not a pre-release (already promoted?)"
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Validated: ${RELEASE_TAG} is a pre-release, ready to promote"

      - id: generate_changelog
        name: Generate Release Changelog
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          # Generate full changelog for this release version
          TAG="${{ steps.validate_tag.outputs.tag }}"
          CHANGELOG=$(convco changelog "${TAG}" 2>/dev/null || echo "Release ${TAG}")
          echo "${CHANGELOG}" > /tmp/changelog.md
          echo "Generated release changelog for ${TAG}"

      - id: promote_release
        name: Promote Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.validate_tag.outputs.tag }}" \
            --prerelease=false \
            --title "Release ${{ steps.validate_tag.outputs.tag }}" \
            --notes-file /tmp/changelog.md

          echo "Promoted ${{ steps.validate_tag.outputs.tag }} to release"

  ##################################################
  # Deploy to Mainnet
  # Calls cd-mainnet.yaml via workflow_call
  ##################################################

  deploy-mainnet:
    name: Deploy (Mainnet)
    needs: promote
    uses: ./.github/workflows/cd-mainnet.yaml
    with:
      version: ${{ needs.promote.outputs.tag }}
      accept_breaking_changes: ${{ inputs.accept_breaking_changes == true }}
    secrets: inherit

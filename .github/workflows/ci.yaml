---
##################################################
# Name: ci.yaml
# Description: Gatekeeper entrypoint for CI checks
##################################################

name: CI

on:
  pull_request:
    branches:
      - trunk

  merge_group:
    branches:
      - trunk

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  security-events: write
  statuses: write
  actions: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

jobs:
  ##################################################
  # Gatekeeper - Prime the Nix Cache for parallel jobs
  ##################################################
  setup-environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  ##################################################
  # Parallel Check - Devenv Test
  ##################################################
  ci-devenv:
    name: Check Devenv
    needs: setup-environment
    uses: ./.github/workflows/ci-devenv.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Lint
  ##################################################
  ci-lint:
    name: Check Lint
    needs: setup-environment
    uses: ./.github/workflows/ci-lint.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Test
  ##################################################
  ci-test:
    name: Check Test
    needs: setup-environment
    uses: ./.github/workflows/ci-test.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Build Rust Canisters + Candid
  ##################################################
  ci-build-rust:
    name: Check Build Rust
    needs: setup-environment
    uses: ./.github/workflows/ci-build-rust.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Build TypeScript
  ##################################################
  ci-build-typescript:
    name: Check Build TypeScript
    needs: setup-environment
    uses: ./.github/workflows/ci-build-typescript.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - PR Title
  ##################################################
  ci-pr-title:
    name: Check PR Title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-pr-title.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Trivy Security Scan
  ##################################################
  ci-trivy:
    name: Check Trivy
    needs: setup-environment
    uses: ./.github/workflows/ci-trivy.yaml
    secrets: inherit

  ##################################################
  # Status Report Aggregator
  ##################################################
  status:
    name: CI Status
    needs:
      - ci-pr-title
      - ci-trivy
      - ci-devenv
      - ci-lint
      - ci-test
      - ci-build-rust
      - ci-build-typescript
    if: always()
    runs-on: ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6

      - id: write_summary
        name: Write Results Summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          status_emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⛔" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "⏳" ;;
            esac
          }

          {
            echo "## CI Results"
            echo ""
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "> **PR #${PR_NUMBER}** — ${PR_TITLE}"
              echo "> _${PR_HEAD} → ${PR_BASE}_"
              echo ""
            fi
            echo "| Job | Status |"
            echo "|-----|--------|"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "| PR Title | $(status_emoji '${{ needs.ci-pr-title.result }}') ${{ needs.ci-pr-title.result }} |"
            fi
            echo "| Trivy | $(status_emoji '${{ needs.ci-trivy.result }}') ${{ needs.ci-trivy.result }} |"
            echo "| Devenv | $(status_emoji '${{ needs.ci-devenv.result }}') ${{ needs.ci-devenv.result }} |"
            echo "| Lint | $(status_emoji '${{ needs.ci-lint.result }}') ${{ needs.ci-lint.result }} |"
            echo "| Test | $(status_emoji '${{ needs.ci-test.result }}') ${{ needs.ci-test.result }} |"
            echo "| Build Rust | $(status_emoji '${{ needs.ci-build-rust.result }}') ${{ needs.ci-build-rust.result }} |"
            echo "| Build TypeScript | $(status_emoji '${{ needs.ci-build-typescript.result }}') ${{ needs.ci-build-typescript.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: check_failures
        name: Check for Failures
        run: |
          ALL_JOBS="${{ needs.ci-pr-title.result }},${{ needs.ci-trivy.result }},${{ needs.ci-devenv.result }},${{ needs.ci-lint.result }},${{ needs.ci-test.result }},${{ needs.ci-build-rust.result }},${{ needs.ci-build-typescript.result }}"
          if echo "${ALL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"

      - id: report_status
        name: Report Status
        if: always()
        uses: ./.github/actions/report-status
        with:
          result: ${{ steps.check_failures.outcome }}
          success-message: "All CI checks passed!"
          failure-message: "One or more CI checks failed!"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

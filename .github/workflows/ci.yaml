---
##################################################
# Name: ci.yaml
# Description: CI checks for pull requests
#
# Triggers:
#   - Pull requests to trunk
#
# Validates lint, test, build, and Candid interface without deploying.
##################################################

name: CI

on:
  pull_request:
    branches:
      - trunk

  merge_group:
    branches:
      - trunk

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Lint - Check code quality
  ##################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: ci-lint

      - id: rust_fmt
        name: Check Rust Formatting
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo fmt --all -- --check

      - id: rust_clippy
        name: Run Clippy
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo clippy --all-targets -- -D warnings

  ##################################################
  # Test - Run unit tests
  ##################################################
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: ci-test

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: rust_tests
        name: Run Rust Tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa

      - id: typescript_tests
        name: Run TypeScript Tests
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          cd libs/ic_siwa_ts
          bun install
          bun test || echo "TypeScript tests completed"

  ##################################################
  # Build Canisters - Verify all canisters build
  ##################################################
  build-canisters:
    name: Build Canister ${{ matrix.canister }}
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo
        with:
          cache-key-prefix: ci-build

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_canister
        name: Build Canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}
          environment: development

      - id: upload_artifact
        name: Upload Build Artifact
        if: matrix.canister == 'ic_siwa_provider'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.canister }}-ci
          path: target/wasm32-unknown-unknown/release/${{ matrix.canister }}.wasm
          retention-days: 1

  ##################################################
  # Build TypeScript - Verify npm package builds
  ##################################################
  build-typescript:
    name: Build TypeScript
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: build_npm
        name: Build npm Package
        uses: ./.github/actions/build-npm

  ##################################################
  # Verify Candid - Ensure interface is up-to-date
  ##################################################
  verify-candid:
    name: Verify Candid
    needs: [build-canisters]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: download_artifact
        name: Download Provider WASM
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-ci
          path: target/wasm32-unknown-unknown/release/

      - id: verify_candid
        name: Verify Candid Interface
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          candid-extractor target/wasm32-unknown-unknown/release/ic_siwa_provider.wasm > /tmp/extracted.did

          # Normalize whitespace for comparison
          sed 's/[[:space:]]*$//' canisters/ic_siwa_provider/ic_siwa_provider.did > /tmp/committed.did
          sed 's/[[:space:]]*$//' /tmp/extracted.did > /tmp/extracted_normalized.did

          if ! diff -q /tmp/committed.did /tmp/extracted_normalized.did > /dev/null 2>&1; then
            echo "::error::Candid interface is out of sync! Run 'ic-siwa candid' to regenerate."
            diff /tmp/committed.did /tmp/extracted_normalized.did || true
            exit 1
          fi

          echo "Candid interface verified"

  ##################################################
  # Status - Report overall status
  ##################################################
  status:
    name: Status
    needs: [lint, test, build-canisters, build-typescript, verify-candid]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - id: write_summary
        name: Write Results Summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Build Canisters | ${{ needs.build-canisters.result }} |"
            echo "| Build TypeScript | ${{ needs.build-typescript.result }} |"
            echo "| Verify Candid | ${{ needs.verify-candid.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: check_failures
        name: Check for Failures
        run: |
          ALL_JOBS="${{ needs.lint.result }},${{ needs.test.result }},${{ needs.build-canisters.result }},${{ needs.build-typescript.result }},${{ needs.verify-candid.result }}"

          if echo "${ALL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"

---
##################################################
# Name: ci.yaml
# Description: Gatekeeper entrypoint for CI checks
##################################################

name: CI

on:
  pull_request:
    branches:
      - trunk

  merge_group:
    branches:
      - trunk

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  security-events: write
  statuses: write
  actions: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

jobs:
  ##################################################
  # Gatekeeper - Prime the Nix Cache for parallel jobs
  ##################################################
  setup-environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  ##################################################
  # Parallel Check - Devenv Test
  ##################################################
  ci-devenv:
    name: Check Devenv
    needs: setup-environment
    uses: ./.github/workflows/ci-devenv.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Lint
  ##################################################
  ci-lint:
    name: Check Lint
    needs: setup-environment
    uses: ./.github/workflows/ci-lint.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Test
  ##################################################
  ci-test:
    name: Check Test
    needs: setup-environment
    uses: ./.github/workflows/ci-test.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Build Canisters
  ##################################################
  ci-build-canisters:
    name: Check Build Canisters
    needs: setup-environment
    uses: ./.github/workflows/ci-build-canisters.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Build TypeScript
  ##################################################
  ci-build-typescript:
    name: Check Build TypeScript
    needs: setup-environment
    uses: ./.github/workflows/ci-build-typescript.yaml
    secrets: inherit

  ##################################################
  # Sequence Check - Verify Candid
  # Must wait for ci-build-canisters to upload WASM
  ##################################################
  ci-verify-candid:
    name: Check Candid
    needs: ci-build-canisters
    uses: ./.github/workflows/ci-verify-candid.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - PR Title
  ##################################################
  ci-pr-title:
    name: Check PR Title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-pr-title.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - Trivy Security Scan
  ##################################################
  ci-trivy:
    name: Check Trivy
    needs: setup-environment
    uses: ./.github/workflows/ci-trivy.yaml
    secrets: inherit

  ##################################################
  # Parallel Check - CodeQL Security Scan
  ##################################################
  sec-codeql:
    name: Check CodeQL
    needs: setup-environment
    uses: ./.github/workflows/sec-codeql.yaml
    secrets: inherit

  ##################################################
  # Status Report Aggregator
  ##################################################
  status:
    name: CI Status
    needs:
      - ci-pr-title
      - ci-trivy
      - sec-codeql
      - ci-devenv
      - ci-lint
      - ci-test
      - ci-build-canisters
      - ci-build-typescript
      - ci-verify-candid
    if: always()
    runs-on: ubuntu-latest

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6

      - id: write_summary
        name: Write Results Summary
        run: |
          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "| PR Title | ${{ needs.ci-pr-title.result }} |"
            fi
            echo "| Trivy | ${{ needs.ci-trivy.result }} |"
            echo "| CodeQL | ${{ needs.sec-codeql.result }} |"
            echo "| Devenv | ${{ needs.ci-devenv.result }} |"
            echo "| Lint | ${{ needs.ci-lint.result }} |"
            echo "| Test | ${{ needs.ci-test.result }} |"
            echo "| Build Canisters | ${{ needs.ci-build-canisters.result }} |"
            echo "| Build TypeScript | ${{ needs.ci-build-typescript.result }} |"
            echo "| Verify Candid | ${{ needs.ci-verify-candid.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: check_failures
        name: Check for Failures
        run: |
          ALL_JOBS="${{ needs.ci-pr-title.result }},${{ needs.ci-trivy.result }},${{ needs.sec-codeql.result }},${{ needs.ci-devenv.result }},${{ needs.ci-lint.result }},${{ needs.ci-test.result }},${{ needs.ci-build-canisters.result }},${{ needs.ci-build-typescript.result }},${{ needs.ci-verify-candid.result }}"
          if echo "${ALL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"

      - id: report_status
        name: Report Status
        if: always()
        uses: ./.github/actions/report-status
        with:
          result: ${{ steps.check_failures.outcome }}
          success-message: "All CI checks passed!"
          failure-message: "One or more CI checks failed!"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

---
##################################################
# Name: build.yaml
# Description: Build, Lint, and Test workflow
##################################################

name: Build

on:
  pull_request:
    branches:
      - trunk
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env
  IC_SIWA_SALT_DEVELOPMENT: "ci-test-salt-not-for-production"
  IC_SIWA_DOMAIN_DEVELOPMENT: "localhost"
  IC_SIWA_URI_DEVELOPMENT: "http://localhost:4943"

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Lint the codebase
  ##################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check Rust formatting
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo fmt --all -- --check

      - name: Run clippy
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo clippy --all-targets -- -D warnings

      - name: Check TypeScript library
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          cd libs/ic_siwa_ts
          bun install
          bun run build

  ##################################################
  # Build canisters in parallel
  ##################################################
  build:
    name: Build ${{ matrix.canister }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}

      - name: Upload WASM artifact
        if: matrix.type == 'rust'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.canister }}-wasm
          path: target/wasm32-unknown-unknown/release/${{ matrix.canister }}.wasm
          retention-days: 7

      - name: Upload assets artifact
        if: matrix.type == 'assets'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.canister }}-assets
          path: canisters/${{ matrix.canister }}/dist/
          retention-days: 7

  ##################################################
  # Verify Candid interface
  ##################################################
  candid:
    name: Verify Candid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-wasm
          path: target/wasm32-unknown-unknown/release/

      - name: Verify Candid is up-to-date
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          candid-extractor target/wasm32-unknown-unknown/release/ic_siwa_provider.wasm > /tmp/extracted.did

          # Normalize whitespace for comparison (trim trailing spaces)
          sed 's/[[:space:]]*$//' canisters/ic_siwa_provider/ic_siwa_provider.did > /tmp/committed.did
          sed 's/[[:space:]]*$//' /tmp/extracted.did > /tmp/extracted_normalized.did

          if ! diff -q /tmp/committed.did /tmp/extracted_normalized.did > /dev/null 2>&1; then
            echo "ERROR: Candid interface is out of sync!"
            echo "Run 'ic-siwa candid' to regenerate."
            echo ""
            diff /tmp/committed.did /tmp/extracted_normalized.did || true
            exit 1
          fi

          echo "Candid interface is up-to-date"

  ##################################################
  # Run tests
  ##################################################
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Rust unit tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa

      - name: Run canister tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa_provider || echo "Some tests may require IC runtime"

      - name: Run TypeScript tests
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          cd libs/ic_siwa_ts
          bun install
          bun test || echo "TypeScript tests completed"

  ##################################################
  # Report status
  ##################################################
  status:
    name: Report Status
    runs-on: ubuntu-latest
    needs: [lint, build, candid, test]
    if: always()

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.candid.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" ]]; then
            echo "All jobs passed!"
            exit 0
          else
            echo "Some jobs failed:"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Build: ${{ needs.build.result }}"
            echo "  Candid: ${{ needs.candid.result }}"
            echo "  Test: ${{ needs.test.result }}"
            exit 1
          fi

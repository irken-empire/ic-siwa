---
##################################################
# Name: build.yaml
# Description: Build, Lint, and Test workflow
##################################################

name: Build

on:
  pull_request:
    branches:
      - trunk
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  PROJECT: ${{ github.repository }}
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env
  # Development secrets for CI
  IC_SIWA_SALT_DEVELOPMENT: "ci-test-salt-not-for-production"
  IC_SIWA_DOMAIN_DEVELOPMENT: "localhost"
  IC_SIWA_URI_DEVELOPMENT: "http://localhost:4943"

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Lint the codebase
  ##################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix
        uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Check formatting
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo fmt --all -- --check

      - name: Run clippy
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo clippy --all-targets -- -D warnings

  ##################################################
  # Build the project
  ##################################################
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix
        uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Build Rust crates
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo build --release

      - name: Build WASM canisters
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo build --release --target wasm32-unknown-unknown -p ic_siwa_provider

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-canisters
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  ##################################################
  # Run tests
  ##################################################
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix
        uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Run unit tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa

      - name: Run canister tests
        shell: devenv shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa_provider || echo "Some canister tests may require IC runtime"

  ##################################################
  # Report status
  ##################################################
  status:
    name: Report Status
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always()

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" ]]; then
            echo "All jobs passed!"
            exit 0
          else
            echo "Some jobs failed:"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Build: ${{ needs.build.result }}"
            echo "  Test: ${{ needs.test.result }}"
            exit 1
          fi

---
##################################################
# Name: deploy-mainnet.yml
# Description: Deploy to IC Mainnet (Avalanche Mainnet config)
##################################################

name: Deploy Mainnet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-mainnet' to confirm"
        required: true

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  DFX_NETWORK: ic
  NIXPKGS_ALLOW_UNFREE: 1

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Validate deployment
  ##################################################
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-mainnet" ]; then
            echo "ERROR: Type 'deploy-mainnet' to confirm deployment"
            exit 1
          fi

      - name: Validate release trigger
        if: github.event_name == 'release'
        run: |
          echo "Deploying release: ${{ github.event.release.tag_name }}"
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "ERROR: Cannot deploy pre-release to mainnet!"
            exit 1
          fi

  ##################################################
  # Build provider canister
  ##################################################
  build:
    name: Build Provider
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build canister
        uses: ./.github/actions/build-canister
        with:
          canister: ic_siwa_provider
          type: rust
          optimize: "true"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ic_siwa_provider-mainnet
          path: target/wasm32-unknown-unknown/release/ic_siwa_provider.wasm
          retention-days: 30

  ##################################################
  # Verify Candid interface
  ##################################################
  verify-candid:
    name: Verify Candid
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-mainnet
          path: target/wasm32-unknown-unknown/release/

      - name: Verify Candid
        shell: devenv shell --quiet bash -- -e {0}
        run: |
          candid-extractor target/wasm32-unknown-unknown/release/ic_siwa_provider.wasm > /tmp/extracted.did

          if ! diff -q canisters/ic_siwa_provider/ic_siwa_provider.did /tmp/extracted.did > /dev/null 2>&1; then
            echo "CRITICAL: Candid interface mismatch!"
            echo "Cannot deploy to mainnet with mismatched interface."
            diff canisters/ic_siwa_provider/ic_siwa_provider.did /tmp/extracted.did || true
            exit 1
          fi

          echo "Candid interface verified"

  ##################################################
  # Deploy to mainnet
  ##################################################
  deploy:
    name: Deploy to Mainnet
    needs: [build, verify-candid]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mainnet
    outputs:
      canister_id: ${{ steps.deploy.outputs.canister_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-mainnet
          path: target/wasm32-unknown-unknown/release/

      - name: Deploy canister
        id: deploy
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          network: ic
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          init_args: |
            (record {
              domain = "${{ secrets.IC_SIWA_DOMAIN_MAINNET }}";
              uri = "${{ secrets.IC_SIWA_URI_MAINNET }}";
              salt = "${{ secrets.IC_SIWA_SALT_MAINNET }}";
              chain_id = 43114 : nat64;
              session_expiration_time = 1800000000000 : nat64;
              allowed_domains = opt vec {};
              allowed_canisters = opt vec {};
            })

  ##################################################
  # Verify deployment
  ##################################################
  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          network: ic
          canister_id: ${{ needs.deploy.outputs.canister_id }}

  ##################################################
  # Update release
  ##################################################
  update-release:
    name: Update Release
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Update release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |
            ---
            ## Deployment Status

            | Property | Value |
            |----------|-------|
            | **Network** | IC Mainnet |
            | **Avalanche Chain** | Mainnet (43114) |
            | **Canister ID** | `${{ needs.deploy.outputs.canister_id }}` |
            | **Candid UI** | [Open](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id=${{ needs.deploy.outputs.canister_id }}) |
            | **Status** | Verified |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

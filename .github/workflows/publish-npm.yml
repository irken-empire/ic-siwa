---
##################################################
# Name: publish-npm.yml
# Description: Publish ic-siwa TypeScript library to npm
#
# Uses Trusted Publishing (OIDC) - no npm token required!
# Setup on npmjs.com:
#   1. Go to package settings -> Trusted Publisher
#   2. Select GitHub Actions
#   3. Configure:
#      - Organization/user: irken-empire
#      - Repository: ic-siwa
#      - Workflow filename: publish-npm.yml
##################################################

name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Build and test the library
  ##################################################
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: libs/ic_siwa_ts
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: libs/ic_siwa_ts
        run: bun run build

      - name: Run tests
        working-directory: libs/ic_siwa_ts
        run: bun test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ic-siwa-dist
          path: libs/ic_siwa_ts/dist
          retention-days: 1

  ##################################################
  # Publish to npm using Trusted Publishing (OIDC)
  ##################################################
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ic-siwa-dist
          path: libs/ic_siwa_ts/dist

      - name: Install dependencies
        working-directory: libs/ic_siwa_ts
        run: bun install --frozen-lockfile

      - name: Verify package
        working-directory: libs/ic_siwa_ts
        run: npm pack --dry-run

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        working-directory: libs/ic_siwa_ts
        run: npm publish --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        working-directory: libs/ic_siwa_ts
        # Trusted publishing via OIDC
        # Provenance is automatically generated
        run: npm publish --access public

      - name: Summary
        run: |
          VERSION="$(jq -r .version libs/ic_siwa_ts/package.json)"
          {
            echo "## Published ic-siwa@${VERSION}"
            echo ""
            echo "Install with:"
            echo '```bash'
            echo "bun add ic-siwa@${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

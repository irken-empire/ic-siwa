---
##################################################
# Name: release-canisters.yml
# Description: Deploy IC-SIWA canisters to IC
#
# Triggers:
#   - workflow_run: After successful Build workflow (testnet/mainnet only)
#   - workflow_dispatch: Manual deployment with environment selection
#
# This workflow:
#   1. Downloads pre-built canister artifacts from Build workflow
#   2. Deploys canisters to the Internet Computer
#   3. Creates a GitHub release (pre-release for testnet, release for mainnet)
#
# The GitHub release creation triggers release-npm.yml for npm publishing.
##################################################

name: Release Canisters

on:
  # Run when Build workflow completes
  # - Build triggered by trunk push → testnet
  # - Build triggered by release → mainnet
  workflow_run:
    workflows:
      - "Build"
    types:
      - completed
  # Allow manual runs
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - testnet
          - mainnet
        default: testnet
      confirm_mainnet:
        description: "For mainnet: select 'deploy-to-mainnet' to confirm"
        required: true
        type: choice
        options:
          - "no"
          - "deploy-to-mainnet"
        default: "no"
      run_id:
        description: "Build workflow run ID (leave empty for latest)"
        required: false
        type: string

concurrency:
  group: release-canisters-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Setup - Determine environment and validate
  ##################################################
  setup:
    name: Setup
    runs-on: ubuntu-latest
    # Only run if:
    # - Manual trigger, OR
    # - Build succeeded AND was NOT triggered by PR (development builds don't deploy)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      github_environment: ${{ steps.config.outputs.github_environment }}
      is_mainnet: ${{ steps.config.outputs.is_mainnet }}
      run_id: ${{ steps.config.outputs.run_id }}
      should_deploy: ${{ steps.config.outputs.should_deploy }}
      debug: ${{ steps.read-config.outputs.debug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD_DEPLOY="true"

          # Determine environment and run_id based on trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
            # Use provided run_id or find the latest successful build
            if [[ -n "${{ inputs.run_id }}" ]]; then
              RUN_ID="${{ inputs.run_id }}"
            else
              echo "::notice::No run_id provided, will use latest successful build"
              RUN_ID=""
            fi
          else
            # workflow_run trigger - need to determine environment from Build workflow
            RUN_ID="${{ github.event.workflow_run.id }}"

            # Check if Build was triggered by push (testnet) or workflow_dispatch
            BUILD_EVENT="${{ github.event.workflow_run.event }}"

            if [[ "${BUILD_EVENT}" == "push" ]]; then
              # Push to trunk = testnet
              ENVIRONMENT="testnet"
            elif [[ "${BUILD_EVENT}" == "workflow_dispatch" ]]; then
              # Manual Build - check artifacts to determine environment
              # Try to find which artifact exists (testnet or mainnet)
              ARTIFACTS=$(gh api "/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name' 2>/dev/null || echo "")

              if echo "${ARTIFACTS}" | grep -q "mainnet"; then
                ENVIRONMENT="mainnet"
              elif echo "${ARTIFACTS}" | grep -q "testnet"; then
                ENVIRONMENT="testnet"
              elif echo "${ARTIFACTS}" | grep -q "development"; then
                # Development builds don't deploy
                ENVIRONMENT="development"
                SHOULD_DEPLOY="false"
              else
                echo "::error::Could not determine environment from Build artifacts"
                exit 1
              fi
            else
              # Unknown trigger - skip
              SHOULD_DEPLOY="false"
              ENVIRONMENT="unknown"
            fi
          fi

          # Skip deployment for development environment
          if [[ "${ENVIRONMENT}" == "development" ]]; then
            SHOULD_DEPLOY="false"
          fi

          # Map to GitHub Environment name
          case "${ENVIRONMENT}" in
            testnet) GITHUB_ENV="Testnet" ;;
            mainnet) GITHUB_ENV="Mainnet" ;;
            *) GITHUB_ENV="" ;;
          esac

          IS_MAINNET=$([[ "${ENVIRONMENT}" == "mainnet" ]] && echo "true" || echo "false")

          {
            echo "environment=${ENVIRONMENT}"
            echo "github_environment=${GITHUB_ENV}"
            echo "is_mainnet=${IS_MAINNET}"
            echo "run_id=${RUN_ID}"
            echo "should_deploy=${SHOULD_DEPLOY}"
          } >> "$GITHUB_OUTPUT"

          # Summary will be written after read-config to include all values

      - name: Validate mainnet deployment
        if: steps.config.outputs.is_mainnet == 'true'
        run: |
          # For manual mainnet deployments, require confirmation
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.confirm_mainnet }}" != "deploy-to-mainnet" ]]; then
              echo "::error::Select 'deploy-to-mainnet' in the confirmation dropdown to deploy to mainnet"
              exit 1
            fi
          fi

          # For workflow_run from release, check it's not a pre-release
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "Deploying from Build workflow run: ${{ github.event.workflow_run.id }}"
          fi

      - name: Read config
        id: read-config
        if: steps.config.outputs.should_deploy == 'true'
        uses: ./.github/actions/read-config
        with:
          environment: ${{ steps.config.outputs.environment }}
          skip_summary: "true"

      - name: Write configuration summary
        if: always()
        run: |
          {
            echo "## Release Canisters Configuration"
            echo ""
            echo "### Workflow"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Environment | ${{ steps.config.outputs.environment }} |"
            echo "| Is Mainnet | ${{ steps.config.outputs.is_mainnet }} |"
            echo "| Should Deploy | ${{ steps.config.outputs.should_deploy }} |"
            echo "| Build Run ID | ${{ steps.config.outputs.run_id || 'latest' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Only show config values if deploying
          if [[ "${{ steps.config.outputs.should_deploy }}" == "true" ]]; then
            {
              echo ""
              echo "### Canister Configuration"
              echo "| Setting | Value |"
              echo "|---------|-------|"
              echo "| Config File | \`${{ steps.read-config.outputs.config_file }}\` |"
              echo "| Chain ID | ${{ steps.read-config.outputs.chain_id }} |"
              echo "| Domain | ${{ steps.read-config.outputs.domain }} |"
              echo "| URI | ${{ steps.read-config.outputs.uri }} |"
              echo "| Provider Canister ID | \`${{ steps.read-config.outputs.provider_canister_id || 'not set' }}\` |"
              echo "| Debug Mode | ${{ steps.read-config.outputs.debug }} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ##################################################
  # Deploy Provider - Deploy ic_siwa_provider canister
  ##################################################
  deploy-provider:
    name: Deploy Provider
    needs: [setup]
    if: needs.setup.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.setup.outputs.github_environment }}
    outputs:
      canister_id: ${{ steps.deploy.outputs.canister_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: ${{ needs.setup.outputs.environment }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ic_siwa_provider-${{ needs.setup.outputs.environment }}
          path: target/wasm32-unknown-unknown/release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.setup.outputs.run_id }}

      - name: Read config
        id: config
        uses: ./.github/actions/read-config
        with:
          environment: ${{ needs.setup.outputs.environment }}
          skip_summary: "true"

      - name: Deploy canister
        id: deploy
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          init_args: |
            (record {
              domain = "${{ steps.config.outputs.domain }}";
              uri = "${{ steps.config.outputs.uri }}";
              salt = "${{ secrets.IC_SIWA_SALT }}";
              chain_id = ${{ steps.config.outputs.chain_id }} : nat64;
              session_expiration_time = ${{ steps.config.outputs.session_expiration_ns }} : nat64;
              allowed_domains = opt vec { ${{ steps.config.outputs.allowed_domains }} };
              allowed_canisters = opt vec { ${{ steps.config.outputs.allowed_canisters }} };
              delegation_targets = opt vec { ${{ steps.config.outputs.delegation_targets }} };
              rate_limits = opt record {
                max_logins_per_address = ${{ steps.config.outputs.rate_limit_per_address }} : nat32;
                max_logins_total = ${{ steps.config.outputs.rate_limit_total }} : nat32;
                window_seconds = ${{ steps.config.outputs.rate_limit_window }} : nat64;
              };
              debug = opt ${{ steps.config.outputs.debug }};
            })

  ##################################################
  # Verify Deployment - Test deployed canister
  ##################################################
  verify-deployment:
    name: Verify Deployment
    needs: [setup, deploy-provider]
    if: needs.setup.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: ${{ needs.setup.outputs.environment }}

      - name: Verify canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          canister_id: ${{ needs.deploy-provider.outputs.canister_id }}

  ##################################################
  # Deploy Test Canisters - Testnet only
  ##################################################
  deploy-test-canisters:
    name: Deploy Test Canisters
    needs: [setup, deploy-provider, verify-deployment]
    if: |
      needs.setup.outputs.should_deploy == 'true' &&
      needs.setup.outputs.environment == 'testnet' &&
      needs.setup.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.setup.outputs.github_environment }}
    outputs:
      test_canister_rs_id: ${{ steps.deploy-rs.outputs.canister_id }}
      test_canister_ts_id: ${{ steps.deploy-ts.outputs.canister_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: ${{ needs.setup.outputs.environment }}

      - name: Download test_canister_rs
        uses: actions/download-artifact@v4
        with:
          name: test_canister_rs-${{ needs.setup.outputs.environment }}
          path: target/wasm32-unknown-unknown/release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.setup.outputs.run_id }}

      - name: Download test_canister_ts
        uses: actions/download-artifact@v4
        with:
          name: test_canister_ts-${{ needs.setup.outputs.environment }}
          path: canisters/test_canister_ts/dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.setup.outputs.run_id }}

      - name: Deploy test_canister_rs
        id: deploy-rs
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_rs
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}

      - name: Deploy test_canister_ts
        id: deploy-ts
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_ts
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}

  ##################################################
  # Release - Create or update GitHub release
  ##################################################
  release:
    name: Create Release
    needs: [setup, deploy-provider, verify-deployment, deploy-test-canisters]
    if: |
      always() &&
      needs.setup.outputs.should_deploy == 'true' &&
      needs.verify-deployment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read config
        id: config
        uses: ./.github/actions/read-config
        with:
          environment: ${{ needs.setup.outputs.environment }}
          skip_summary: "true"

      - name: Get version
        id: version
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Testnet: Create pre-release (triggers npm dry run)
      - name: Create testnet release
        if: needs.setup.outputs.environment == 'testnet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}-testnet
          name: "${{ steps.version.outputs.version }} (Testnet)"
          body: |
            ## IC-SIWA Testnet Release

            ### Provider Canister

            | Property | Value |
            |----------|-------|
            | **Network** | IC Mainnet |
            | **Avalanche Chain** | Fuji Testnet (${{ steps.config.outputs.chain_id }}) |
            | **Canister ID** | `${{ needs.deploy-provider.outputs.canister_id }}` |
            | **Candid UI** | [Open](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id=${{ needs.deploy-provider.outputs.canister_id }}) |

            ### Test Canisters

            | Canister | ID | Link |
            |----------|----|----- |
            | **test_canister_ts** | `${{ needs.deploy-test-canisters.outputs.test_canister_ts_id || 'N/A' }}` | ${{ needs.deploy-test-canisters.outputs.test_canister_ts_id && format('[Open UI](https://{0}.icp0.io)', needs.deploy-test-canisters.outputs.test_canister_ts_id) || 'N/A' }} |
            | **test_canister_rs** | `${{ needs.deploy-test-canisters.outputs.test_canister_rs_id || 'N/A' }}` | ${{ needs.deploy-test-canisters.outputs.test_canister_rs_id && format('[Candid UI](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id={0})', needs.deploy-test-canisters.outputs.test_canister_rs_id) || 'N/A' }} |

            ---
            *This is a testnet deployment. npm package was published as a dry run.*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mainnet: Create or update release
      - name: Create mainnet release
        if: needs.setup.outputs.environment == 'mainnet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "${{ steps.version.outputs.version }}"
          body: |
            ## IC-SIWA Release

            | Property | Value |
            |----------|-------|
            | **Network** | IC Mainnet |
            | **Avalanche Chain** | Mainnet (${{ steps.config.outputs.chain_id }}) |
            | **Canister ID** | `${{ needs.deploy-provider.outputs.canister_id }}` |
            | **Candid UI** | [Open](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id=${{ needs.deploy-provider.outputs.canister_id }}) |

            ### Installation

            ```bash
            bun add ic-siwa@${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##################################################
  # Status - Report overall status
  ##################################################
  status:
    name: Status
    needs:
      [
        setup,
        deploy-provider,
        verify-deployment,
        deploy-test-canisters,
        release,
      ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write results summary
        run: |
          {
            echo "## Release Canisters Results"
            echo ""
            echo "### Job Status"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Setup | ${{ needs.setup.result }} |"
            echo "| Deploy Provider | ${{ needs.deploy-provider.result }} |"
            echo "| Verify Deployment | ${{ needs.verify-deployment.result }} |"
            echo "| Deploy Test Canisters | ${{ needs.deploy-test-canisters.result }} |"
            echo "| Release | ${{ needs.release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Show deployed artifacts if successful
          if [[ "${{ needs.deploy-provider.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Deployed Canisters"
              echo "| Canister | ID | Link |"
              echo "|----------|----|----- |"
              echo "| **ic_siwa_provider** | \`${{ needs.deploy-provider.outputs.canister_id }}\` | [Candid UI](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id=${{ needs.deploy-provider.outputs.canister_id }}) |"
            } >> "$GITHUB_STEP_SUMMARY"

            # Add test canisters if deployed
            if [[ "${{ needs.deploy-test-canisters.result }}" == "success" ]]; then
              {
                echo "| **test_canister_ts** | \`${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}\` | [Open UI](https://${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}.icp0.io) |"
                echo "| **test_canister_rs** | \`${{ needs.deploy-test-canisters.outputs.test_canister_rs_id }}\` | [Candid UI](https://a4gq6-oaaaa-aaaab-qaa4q-cai.raw.icp0.io/?id=${{ needs.deploy-test-canisters.outputs.test_canister_rs_id }}) |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Check for failures
        run: |
          DEPLOY_JOBS="${{ needs.deploy-provider.result }},${{ needs.verify-deployment.result }}"
          if echo "${DEPLOY_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::Deployment failed"
            exit 1
          fi

          echo "Canister deployment completed successfully!"

---
##################################################
# Name: devenv-update.yaml
# Description: Workflow for Updating Developer Environment
##################################################

name: Devenv Update

on:
  # Update on schedule
  schedule:
    - cron: "0 0 * * 0"
  # Allow manual runs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Update devenv dependencies
  ##################################################
  update:
    name: Update
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Secretspec check
        shell: devenv shell --quiet bash -- -e {0}
        run: secretspec check

      - name: Devenv update
        run: devenv update

      - name: Install dependencies
        shell: devenv shell --quiet bash -- -e {0}
        run: bun run install-deps

      - name: Devenv test
        run: devenv test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update devenv.lock"
          title: "chore: Update devenv.lock"
          body: "This PR updates the devenv input dependencies"
          branch: "update-devenv-lock"
          base: ${{ github.event.repository.default_branch }}
          labels: "dependencies"
          assignees: "MAHDTech"
          reviewers: "MAHDTech"
          draft: false
          signoff: true
          delete-branch: true
          sign-commits: true

---
##################################################
# Name: devenv.yaml
# Description: Workflow for Developer Environment Testing
##################################################

name: Devenv

on:
  # Test Development Environment on PRs.
  pull_request:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Test the Development environment shell
  ##################################################
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configuration summary
        run: |
          {
            echo "## Devenv Configuration"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| PR | ${{ github.event.pull_request.number || 'N/A' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_cache_name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Secretspec check
        shell: devenv shell --quiet bash -- -e {0}
        run: secretspec check

      - name: Install dependencies
        shell: devenv shell --quiet bash -- -e {0}
        run: bun run install-deps

      - name: Devenv test
        id: devenv_test
        run: devenv test

      - name: Write results summary
        if: always()
        run: |
          {
            echo "## Devenv Results"
            echo ""
            echo "### Test Status"
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Devenv Test | ${{ steps.devenv_test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report status
        if: always()
        shell: devenv shell --quiet bash -- -e {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.devenv_test.outcome }}" == "success" ]]; then
            RESULT="success"
            DESCRIPTION="Devenv test passed!"
          else
            RESULT="failure"
            DESCRIPTION="Devenv test failed!"
          fi

          gh api \
            "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="${RESULT}" \
            -f context="${{ github.workflow }}" \
            -f description="${DESCRIPTION}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || {
              echo "Failed to report devenv status!"
              exit 1
            }

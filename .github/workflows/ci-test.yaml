---
##################################################
# Name: ci-test.yaml
# Description: CI Test Suite
##################################################
name: CI Test
on: workflow_call

permissions:
  contents: read

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env

jobs:
  test:
    name: CI Test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: rust_tests
        name: Run Rust Tests
        shell: devenv --no-tui shell --quiet bash -- -e {0}
        run: cargo test -p ic_siwa

      - id: typescript_tests
        name: Run TypeScript Tests
        shell: devenv --no-tui shell --quiet bash -- -e {0}
        run: |
          cd libs/ic_siwa_ts
          bun install
          bun test

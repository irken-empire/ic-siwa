---
##################################################
# Name: release-npm.yml
# Description: Publish ic-siwa TypeScript library to npm
#
# Triggers:
#   - release: When a GitHub release is published
#     - Pre-release (testnet) → dry run
#     - Full release (mainnet) → real publish
#   - workflow_dispatch: Manual publish with dry-run option
#
# This workflow downloads pre-built npm package artifacts from the
# Build workflow and publishes them to the npm registry.
#
# Uses Trusted Publishing (OIDC) - no npm token required!
# Setup on npmjs.com:
#   1. Go to package settings -> Trusted Publisher
#   2. Select GitHub Actions
#   3. Configure:
#      - Organization/user: irken-empire
#      - Repository: ic-siwa
#      - Workflow filename: release-npm.yml
##################################################

name: Release npm

on:
  # Run when a GitHub release is published
  # - Pre-release (testnet) → dry run
  # - Full release (mainnet) → real publish
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_id:
        description: "Build workflow run ID (leave empty for latest)"
        required: false
        type: string

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write # Required for OIDC trusted publishing

env:
  SECRETSPEC_PROVIDER: env

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Setup - Determine if we should publish
  ##################################################
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.config.outputs.should_publish }}
      is_dry_run: ${{ steps.config.outputs.is_dry_run }}
      run_id: ${{ steps.config.outputs.run_id }}
      environment: ${{ steps.config.outputs.environment }}

    steps:
      - name: Determine configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD_PUBLISH="true"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: use dry_run input
            IS_DRY_RUN="${{ inputs.dry_run }}"

            # Use provided run_id or leave empty for latest
            if [[ -n "${{ inputs.run_id }}" ]]; then
              RUN_ID="${{ inputs.run_id }}"
            else
              RUN_ID=""
            fi

            # Manual triggers use mainnet (real publish) or testnet (dry run)
            if [[ "${IS_DRY_RUN}" == "true" ]]; then
              ENVIRONMENT="testnet"
            else
              ENVIRONMENT="mainnet"
            fi
          else
            # Release trigger - check if pre-release or full release
            IS_PRERELEASE="${{ github.event.release.prerelease }}"

            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              # Pre-release (testnet) → dry run
              IS_DRY_RUN="true"
              ENVIRONMENT="testnet"
            else
              # Full release (mainnet) → real publish
              IS_DRY_RUN="false"
              ENVIRONMENT="mainnet"
            fi

            # Find the Build workflow run that created artifacts for this environment
            # Look for the most recent successful Build run with matching artifacts
            echo "Finding Build workflow run with ${ENVIRONMENT} artifacts..."
            RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"${{ github.sha }}\") | .id" | head -1 || echo "")

            if [[ -z "${RUN_ID}" ]]; then
              # Fallback: find any recent successful build with matching artifacts
              echo "::warning::No Build run found for commit ${{ github.sha }}, searching for latest with ${ENVIRONMENT} artifacts"
              RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=5" \
                --jq '.workflow_runs[0].id' || echo "")
            fi

            if [[ -z "${RUN_ID}" ]]; then
              echo "::error::Could not find a successful Build workflow run"
              SHOULD_PUBLISH="false"
            fi
          fi

          {
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "is_dry_run=${IS_DRY_RUN}"
            echo "run_id=${RUN_ID}"
            echo "environment=${ENVIRONMENT}"
          } >> "$GITHUB_OUTPUT"

          # Summary
          {
            echo "## npm Release Configuration"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Release Tag | \`${{ github.event.release.tag_name || 'N/A' }}\` |"
            echo "| Pre-release | ${{ github.event.release.prerelease || 'N/A' }} |"
            echo "| Environment | ${ENVIRONMENT} |"
            echo "| Should Publish | ${SHOULD_PUBLISH} |"
            echo "| Dry Run | ${IS_DRY_RUN} |"
            echo "| Build Run ID | ${RUN_ID:-latest} |"
          } >> "$GITHUB_STEP_SUMMARY"

  ##################################################
  # Publish - Download artifacts and publish to npm
  ##################################################
  publish:
    name: Publish
    needs: [setup]
    if: needs.setup.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.verify.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ic-siwa-npm-${{ needs.setup.outputs.environment }}
          path: libs/ic_siwa_ts/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.setup.outputs.run_id }}

      - name: Verify package contents
        id: verify
        working-directory: libs/ic_siwa_ts
        run: |
          # Verify dist exists
          if [[ ! -d "dist" ]]; then
            echo "::error::dist directory not found in artifact"
            exit 1
          fi

          # Get version for outputs
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Show what will be published (console only, not summary)
          npm pack --dry-run

      - name: Publish to npm (dry run)
        if: needs.setup.outputs.is_dry_run == 'true'
        working-directory: libs/ic_siwa_ts
        run: |
          npm publish --dry-run

      - name: Publish to npm
        if: needs.setup.outputs.is_dry_run == 'false'
        working-directory: libs/ic_siwa_ts
        run: |
          # Trusted publishing via OIDC - provenance is automatically generated
          npm publish --access public

  ##################################################
  # Status - Report overall status
  ##################################################
  status:
    name: Status
    needs: [setup, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write results summary
        run: |
          {
            echo "## npm Release Results"
            echo ""
            echo "### Job Status"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Setup | ${{ needs.setup.result }} |"
            echo "| Publish | ${{ needs.publish.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Show publish result if successful
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            VERSION="${{ needs.publish.outputs.version }}"
            IS_DRY_RUN="${{ needs.setup.outputs.is_dry_run }}"

            if [[ "${IS_DRY_RUN}" == "true" ]]; then
              {
                echo ""
                echo "### Dry Run Complete"
                echo ""
                echo "Would have published: \`ic-siwa@${VERSION}\`"
                echo ""
                echo "Run with \`dry_run: false\` to actually publish."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo ""
                echo "### Published Package"
                echo ""
                echo "**Package:** \`ic-siwa@${VERSION}\`"
                echo ""
                echo "Install with:"
                echo '```bash'
                echo "bun add ic-siwa@${VERSION}"
                echo "# or"
                echo "npm install ic-siwa@${VERSION}"
                echo '```'
                echo ""
                echo "[View on npm](https://www.npmjs.com/package/ic-siwa/v/${VERSION})"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Check for failures
        run: |
          if [[ "${{ needs.publish.result }}" == "failure" ]]; then
            echo "::error::npm publish failed"
            exit 1
          fi

          if [[ "${{ needs.setup.result }}" == "skipped" ]]; then
            echo "Skipped - npm publish only runs on GitHub Release events"
          elif [[ "${{ needs.setup.outputs.is_dry_run }}" == "true" ]]; then
            echo "npm package published successfully! (dry run)"
          else
            echo "npm package published successfully!"
          fi

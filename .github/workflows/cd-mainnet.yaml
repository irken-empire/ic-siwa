---
##################################################
# Name: cd-mainnet.yaml
# Description: Mainnet release pipeline
#
# Triggers:
#   - Manual dispatch
#
# Flow:
#   1. check-cache probes the Nix store cache key (lookup-only, ~5s).
#   2. setup-environment only runs on a cache miss (~60 min warm-up).
#   3. release validates a pre-release tag and promotes it to a full release.
#   4. build-canisters + build-npm run in parallel.
#   5. deploy-provider deploys to IC mainnet (requires Mainnet environment approval).
#   6. verify-deployment confirms the canister is live.
#   7. deploy-test-canisters + publish-npm run conditionally.
#
# npm OIDC trusted publishing is configured for this workflow.
##################################################

name: Release (Mainnet)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to promote — leave blank to auto-promote the latest pre-release"
        required: false
        type: string
        default: ""
      confirm:
        description: |
          Type "ship it" to confirm the Mainnet release.
        required: true
        type: string
      accept_breaking_changes:
        description: "Accept breaking Candid interface changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  packages: read
  pull-requests: write
  statuses: write

env:
  NIXPKGS_ALLOW_UNFREE: 1
  SECRETSPEC_PROVIDER: env
  ENVIRONMENT: mainnet

defaults:
  run:
    shell: bash

jobs:
  ##################################################
  # Gatekeeper - Check whether the Nix cache already exists
  ##################################################
  check-cache:
    name: Check Cache

    runs-on: ubuntu-latest

    timeout-minutes: 5
    continue-on-error: false

    outputs:
      cache-hit: ${{ steps.nix_cache_lookup.outputs.cache-hit }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: nix_cache_lookup
        name: Lookup Nix Cache
        uses: actions/cache@v5
        with:
          path: /nix
          key: ${{ runner.os }}-nix-${{ hashFiles('devenv.lock', 'devenv.nix') }}
          lookup-only: true

  ##################################################
  # Warm Cache - Only runs on a cache miss
  ##################################################
  setup-environment:
    name: Setup Environment

    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "false"

  ##################################################
  # Promote a pre-release to a full release
  ##################################################
  release:
    name: Release
    needs:
      - check-cache
      - setup-environment

    if: >-
      always() &&
      needs.check-cache.result == 'success'

    runs-on: ubuntu-latest
    environment: Mainnet

    timeout-minutes: 120
    continue-on-error: false

    outputs:
      tag: ${{ steps.validate_tag.outputs.tag }}

    steps:
      - id: confirm_intent
        name: Confirm Intent
        run: |
          if [[ "${{ inputs.confirm }}" != "ship it" ]]; then
            echo "::error::Confirmation must be exactly \"ship it\". Got: \"${{ inputs.confirm }}\""
            exit 1
          fi
          echo "✅ Confirmation accepted"

      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: validate_tag
        name: Validate Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            # User specified a tag — use it directly
            TAG="${RELEASE_TAG}"
            echo "Using provided release tag: ${TAG}"
          else
            # Auto-discover the latest pre-release
            TAG=$(gh release list --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease==true)] | first | .tagName' 2>/dev/null || echo "")

            if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
              echo "::error::No pre-releases found. Create one first via a Testnet deployment."
              exit 1
            fi
            echo "Auto-discovered latest pre-release: ${TAG}"
          fi

          # Verify the release exists and IS a pre-release
          RELEASE_INFO=$(gh release view "${TAG}" --json isPrerelease,tagName 2>&1) || {
            echo "::error::Release '${TAG}' not found"
            exit 1
          }

          IS_PRERELEASE=$(echo "${RELEASE_INFO}" | jq -r '.isPrerelease')
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            echo "::error::Release '${TAG}' has already been promoted to a full release."
            echo "::error::If you want to promote a specific pre-release, enter the tag (e.g. v0.2.3)."
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Validated: ${TAG} is a pre-release, ready to promote"

      - id: generate_changelog
        name: Generate Release Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.validate_tag.outputs.tag }}"

          # Get existing release body (has changelog + testnet table)
          EXISTING=$(gh release view "${TAG}" --json body -q '.body')

          {
            echo "${EXISTING}"
            echo ""
            echo "## :globe_with_meridians: Mainnet Deployment"
            echo ""
            echo "| Resource | ID |"
            echo "|----------|-----|"
            echo "| ic_siwa_provider | (see job output) |"
          } > /tmp/changelog.md

          echo "Generated release changelog with mainnet deployment for ${TAG}"

      - id: promote_release
        name: Promote Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.validate_tag.outputs.tag }}" \
            --prerelease=false \
            --title "Release ${{ steps.validate_tag.outputs.tag }}" \
            --notes-file /tmp/changelog.md

          echo "Promoted ${{ steps.validate_tag.outputs.tag }} to release"

  ##################################################
  # Setup - Read configuration
  ##################################################
  setup:
    name: Setup
    needs:
      - release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: Mainnet
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      debug: ${{ steps.read_config.outputs.debug }}
      domain: ${{ steps.read_config.outputs.domain }}
      uri: ${{ steps.read_config.outputs.uri }}
      chain_id: ${{ steps.read_config.outputs.chain_id }}
      session_expiration_ns: ${{ steps.read_config.outputs.session_expiration_ns }}
      allowed_domains: ${{ steps.read_config.outputs.allowed_domains }}
      allowed_canisters: ${{ steps.read_config.outputs.allowed_canisters }}
      delegation_targets: ${{ steps.read_config.outputs.delegation_targets }}
      rate_limit_per_address: ${{ steps.read_config.outputs.rate_limit_per_address }}
      rate_limit_total: ${{ steps.read_config.outputs.rate_limit_total }}
      rate_limit_window: ${{ steps.read_config.outputs.rate_limit_window }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: get_version
        name: Get Version
        run: |
          echo "version=${{ needs.release.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - id: read_config
        name: Read Config
        uses: ./.github/actions/read-config
        with:
          environment: mainnet

  ##################################################
  # Build Canisters
  ##################################################
  build-canisters:
    name: Build Canister ${{ matrix.canister }}
    needs:
      - setup
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet

    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: ic_siwa_provider
            type: rust
          - canister: test_canister_rs
            type: rust
          - canister: test_canister_ts
            type: assets

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_canister
        name: Build Canister
        uses: ./.github/actions/build-canister
        with:
          canister: ${{ matrix.canister }}
          type: ${{ matrix.type }}
          environment: mainnet
          optimize: "true"
          walletconnect_project_id: ${{ vars.PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.canister }}-mainnet
          path: >-
            ${{ matrix.type == 'rust'
              && format('target/wasm32-unknown-unknown/release/{0}.wasm', matrix.canister)
              || format('canisters/{0}/dist/', matrix.canister) }}
          include-hidden-files: true
          retention-days: 30

  ##################################################
  # Build npm Package
  ##################################################
  build-npm:
    name: Build npm
    needs:
      - setup
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet
    outputs:
      version: ${{ steps.build_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_bun
        name: Cache Bun
        uses: ./.github/actions/cache-bun

      - id: build_npm
        name: Build npm Package
        uses: ./.github/actions/build-npm

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ic-siwa-npm-mainnet
          path: |
            libs/ic_siwa_ts/dist/
            libs/ic_siwa_ts/package.json
            libs/ic_siwa_ts/README.md
          retention-days: 30

  ##################################################
  # Deploy Provider Canister (requires Mainnet approval)
  ##################################################
  deploy-provider:
    name: Deploy Provider
    needs:
      - setup
      - build-canisters
    if: always() && needs.build-canisters.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet
    outputs:
      canister_id: ${{ steps.deploy_canister.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: mainnet

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic_siwa_provider-mainnet
          path: target/wasm32-unknown-unknown/release/

      - id: deploy_canister
        name: Deploy Canister
        uses: ./.github/actions/deploy-canister
        with:
          canister: ic_siwa_provider
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: ${{ inputs.accept_breaking_changes == true }}
          init_args: |
            (record {
              domain = "${{ needs.setup.outputs.domain }}";
              uri = "${{ needs.setup.outputs.uri }}";
              salt = "${{ secrets.IC_SIWA_SALT }}";
              chain_id = ${{ needs.setup.outputs.chain_id }} : nat64;
              session_expiration_time = ${{ needs.setup.outputs.session_expiration_ns }} : nat64;
              allowed_domains = opt vec { ${{ needs.setup.outputs.allowed_domains }} };
              allowed_canisters = opt vec { ${{ needs.setup.outputs.allowed_canisters }} };
              delegation_targets = opt vec { ${{ needs.setup.outputs.delegation_targets }} };
              rate_limits = opt record {
                max_logins_per_address = ${{ needs.setup.outputs.rate_limit_per_address }} : nat32;
                max_logins_total = ${{ needs.setup.outputs.rate_limit_total }} : nat32;
                window_seconds = ${{ needs.setup.outputs.rate_limit_window }} : nat64;
              };
              debug = opt ${{ needs.setup.outputs.debug }};
            })

  ##################################################
  # Verify Deployment
  ##################################################
  verify-deployment:
    name: Verify Deployment
    needs:
      - deploy-provider
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: mainnet

      - id: verify_canister
        name: Verify Canister
        uses: ./.github/actions/verify-canister
        with:
          canister: ic_siwa_provider
          canister_id: ${{ needs.deploy-provider.outputs.canister_id }}

  ##################################################
  # Deploy Test Canisters (when debug=true)
  ##################################################
  deploy-test-canisters:
    name: Deploy Test Canisters
    needs:
      - setup
      - build-canisters
      - deploy-provider
      - verify-deployment
    if: needs.setup.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet
    outputs:
      test_canister_rs_id: ${{ steps.deploy_test_rs.outputs.canister_id }}
      test_canister_ts_id: ${{ steps.deploy_test_ts.outputs.canister_id }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: setup_canister_ids
        name: Setup Canister IDs
        uses: ./.github/actions/setup-canister-ids
        with:
          environment: mainnet

      - id: download_test_rs
        name: Download test_canister_rs
        uses: actions/download-artifact@v7
        with:
          name: test_canister_rs-mainnet
          path: target/wasm32-unknown-unknown/release/

      - id: download_test_ts
        name: Download test_canister_ts
        uses: actions/download-artifact@v7
        with:
          name: test_canister_ts-mainnet
          path: canisters/test_canister_ts/dist/

      - id: deploy_test_rs
        name: Deploy test_canister_rs
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_rs
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

      - id: deploy_test_ts
        name: Deploy test_canister_ts
        uses: ./.github/actions/deploy-canister
        with:
          canister: test_canister_ts
          dfx_identity_pem: ${{ secrets.DFX_IDENTITY_PEM }}
          accept_breaking_changes: "false"

  ##################################################
  # Register Custom Domain (when debug=true)
  ##################################################
  register-domain:
    name: Register Custom Domain
    needs:
      - setup
      - deploy-test-canisters
    if: needs.setup.outputs.debug == 'true' && needs.setup.outputs.domain != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: register_domain
        name: Register Domain
        uses: ./.github/actions/register-domain
        with:
          domain: ${{ needs.setup.outputs.domain }}
          canister_id: ${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}

  ##################################################
  # Publish npm (real publish)
  ##################################################
  publish-npm:
    name: Publish npm
    needs:
      - setup
      - build-npm
      - verify-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Mainnet
    outputs:
      version: ${{ steps.publish_npm.outputs.version }}

    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: download_artifact
        name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ic-siwa-npm-mainnet
          path: libs/ic_siwa_ts/

      - id: publish_npm
        name: Publish npm Package
        uses: ./.github/actions/publish-npm
        with:
          dry_run: "false"
          version: ${{ needs.setup.outputs.version }}

  ##################################################
  # Status
  ##################################################
  status:
    name: Status
    needs:
      [
        release,
        setup,
        build-canisters,
        build-npm,
        deploy-provider,
        verify-deployment,
        deploy-test-canisters,
        register-domain,
        publish-npm,
      ]
    if: always()
    runs-on: ubuntu-latest
    environment: Mainnet

    steps:
      - id: write_summary
        name: Write Results Summary
        run: |
          {
            echo "## Mainnet Release Results"
            echo ""
            echo "### Job Status"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Release | ${{ needs.release.result }} |"
            echo "| Setup | ${{ needs.setup.result }} |"
            echo "| Build Canisters | ${{ needs.build-canisters.result }} |"
            echo "| Build npm | ${{ needs.build-npm.result }} |"
            echo "| Deploy Provider | ${{ needs.deploy-provider.result }} |"
            echo "| Verify Deployment | ${{ needs.verify-deployment.result }} |"
            echo "| Deploy Test Canisters | ${{ needs.deploy-test-canisters.result }} |"
            echo "| Register Domain | ${{ needs.register-domain.result }} |"
            echo "| Publish npm | ${{ needs.publish-npm.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.release.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Release"
              echo "**Tag**: \`${{ needs.release.outputs.tag }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${{ needs.deploy-provider.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Deployed Canisters"
              echo "| Canister | ID |"
              echo "|----------|---|"
              echo "| ic_siwa_provider | \`${{ needs.deploy-provider.outputs.canister_id }}\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "${{ needs.deploy-test-canisters.result }}" == "success" ]]; then
              {
                echo "| test_canister_rs | \`${{ needs.deploy-test-canisters.outputs.test_canister_rs_id }}\` |"
                echo "| test_canister_ts | \`${{ needs.deploy-test-canisters.outputs.test_canister_ts_id }}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [[ "${{ needs.publish-npm.result }}" == "success" ]]; then
            {
              echo ""
              echo "### Published Package"
              echo "**ic-siwa@${{ needs.publish-npm.outputs.version }}**"
              echo ""
              echo "[View on npm](https://www.npmjs.com/package/ic-siwa/v/${{ needs.publish-npm.outputs.version }})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: check_failures
        name: Check for Failures
        run: |
          CRITICAL_JOBS="${{ needs.release.result }},${{ needs.build-canisters.result }},${{ needs.deploy-provider.result }},${{ needs.verify-deployment.result }},${{ needs.publish-npm.result }}"
          if echo "${CRITICAL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::Mainnet release failed"
            exit 1
          fi

          echo "Mainnet release completed successfully!"

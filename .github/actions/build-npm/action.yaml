name: "Build npm Package"
description: "Build the ic-siwa TypeScript library for npm"

outputs:
  version:
    description: "Package version"
    value: ${{ steps.get_version.outputs.version }}
  artifact_path:
    description: "Path to built artifacts"
    value: "libs/ic_siwa_ts/"

runs:
  using: "composite"
  steps:
    - id: install_deps
      name: Install Dependencies
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        # Use devenv from repository root
        cd "$GITHUB_WORKSPACE"
        devenv --no-tui shell --quiet bash -- -c "cd libs/ic_siwa_ts && bun install"

    - id: build_library
      name: Build Library
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        # Use devenv from repository root
        cd "$GITHUB_WORKSPACE"
        devenv --no-tui shell --quiet bash -- -c "cd libs/ic_siwa_ts && bun run build"

    - id: get_version
      name: Get Version
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        VERSION="$(jq -r .version package.json)"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Built ic-siwa@${VERSION}"

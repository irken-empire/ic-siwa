name: "Setup Devenv"
description: "Setup Nix, Cachix, and devenv for IC-SIWA builds"

inputs:
  cachix_cache_name:
    description: "Cachix cache name"
    required: false
    default: ""
  cachix_auth_token:
    description: "Cachix auth token"
    required: false
    default: ""
  github_token:
    description: "GitHub token for Nix"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ inputs.github_token }}

    - name: Enable Cachix
      uses: cachix/cachix-action@v16
      if: inputs.cachix_cache_name != ''
      with:
        name: ${{ inputs.cachix_cache_name }}
        authToken: ${{ inputs.cachix_auth_token }}
        useDaemon: true
        skipPush: false

    - name: Install devenv
      shell: bash
      run: nix profile install --accept-flake-config nixpkgs#devenv

name: "Publish npm Package"
description: "Publish the ic-siwa TypeScript library to npm"

inputs:
  dry_run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  version:
    description: "Package version to publish (e.g. v0.2.2 or 0.2.2)"
    required: true
  provenance:
    description: "Enable npm provenance (requires public repo + OIDC)"
    required: false
    default: "false"

outputs:
  version:
    description: "Published package version"
    value: ${{ steps.verify_package.outputs.version }}
  published:
    description: "Whether the package was actually published (false for dry run)"
    value: ${{ steps.publish_npm.outputs.published }}

runs:
  using: "composite"
  steps:
    - id: setup_bun
      name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - id: setup_node
      name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"

    - id: set_version
      name: Set Package Version
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        VERSION="${{ inputs.version }}"
        VERSION="${VERSION#v}"  # Strip leading 'v' if present
        echo "Setting package version to ${VERSION}"
        npm version "${VERSION}" --no-git-tag-version --allow-same-version

    - id: install_deps
      name: Install Dependencies
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: bun install

    - id: build_package
      name: Build Package
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: bun run build

    - id: verify_package
      name: Verify Package Contents
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        # Verify dist exists
        if [[ ! -d "dist" ]]; then
          echo "::error::dist directory not found"
          exit 1
        fi

        # Get version
        VERSION="$(jq -r .version package.json)"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

        # Show what will be published
        echo "Package contents:"
        npm pack --dry-run

    - id: publish_npm
      name: Publish to npm
      shell: bash
      working-directory: libs/ic_siwa_ts
      run: |
        PROVENANCE_FLAG=""
        if [[ "${{ inputs.provenance }}" == "true" ]]; then
          PROVENANCE_FLAG="--provenance"
          echo "Provenance enabled (public repo + OIDC)"
        fi

        if [[ "${{ inputs.dry_run }}" == "true" ]]; then
          echo "Performing dry run..."
          npm publish --dry-run
          echo "published=false" >> "$GITHUB_OUTPUT"
        else
          echo "Publishing to npm..."
          npm publish --access public ${PROVENANCE_FLAG:-}
          echo "published=true" >> "$GITHUB_OUTPUT"
        fi

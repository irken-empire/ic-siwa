# IC-SIWA Testnet Configuration
# For IC Mainnet deployment with Avalanche Fuji Testnet

domains:
  allowed:
    # Primary domains
    - "irkenempire.tech"
    - "*.irkenempire.tech"
    # Game domains
    - "tresr.community"
    - "*.tresr.community"

avalanche:
  # Avalanche Fuji Testnet
  chain_id: 43113
  rpc_url: "https://api.avax-test.network/ext/bc/C/rpc"

ic:
  network: "ic"
  canisters:
    # Set after first deployment, used by test_canister_ts build
    ic_siwa_provider: ""

security:
  # Allowed canisters for inter-canister calls
  # TODO: Add canister IDs after deployment
  allowed_canisters: []
  # 30 minute sessions
  session_expiration_seconds: 1800
  # 5 minute login window
  login_expiration_seconds: 300

library:
  timeout_ms: 30000

# IC-SIWA Testnet Configuration
# For IC Mainnet deployment with Avalanche Fuji Testnet

avalanche:
  # Avalanche Fuji Testnet
  chain_id: 43113
  rpc_url: "https://api.avax-test.network/ext/bc/C/rpc"

ic:
  network: "ic"
  canisters:
    ic_siwa_provider: "ejj2n-kqaaa-aaaad-qjlxq-cai"
    test_canister_rs: "qyw5d-liaaa-aaaai-avgna-cai"
    test_canister_ts: "kelzz-6qaaa-aaaak-qwlga-cai"

siwa:
  # Default domain/uri for wallet signing prompt (used when calling app doesn't specify one)
  # For multi-tenant "SIWA as a Service", each app can override these via siwa_prepare_login_with_options
  domain: "siwa-testnet.irkenempire.tech"
  uri: "https://siwa-testnet.irkenempire.tech"

security:
  # Allowed domains for SIWA messages (whitelist for multi-tenant support)
  # Apps can only use domains listed here via siwa_prepare_login_with_options
  allowed_domains:
    # Primary domains
    - "irkenempire.tech"
    - "*.irkenempire.tech"
    # Game domains
    - "tresr.community"
    - "*.tresr.community"
    # Add your app domains here...

  # Allowed canisters for inter-canister calls
  # TODO: Add canister IDs after deployment
  allowed_canisters: []

  # Delegation targets - canisters that delegations are valid for
  # TODO: Add your Juno Satellite and other app canister IDs after deployment
  # If empty, delegations work for any canister (less secure)
  delegation_targets: []

  # Rate limiting to prevent cycle drain
  rate_limits:
    # Max prepare_login calls per address per window
    max_logins_per_address: 5
    # Max total prepare_login calls per window (across all addresses)
    max_logins_total: 100
    # Time window in seconds for rate limiting
    window_seconds: 3600

  # 30 minute sessions
  session_expiration_seconds: 1800
  # 5 minute login window
  login_expiration_seconds: 300

library:
  timeout_ms: 30000

# Debug mode
debug: true

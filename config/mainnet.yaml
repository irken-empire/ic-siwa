# IC-SIWA Mainnet Configuration
# For IC Mainnet deployment with Avalanche Mainnet

avalanche:
  # Avalanche C-Chain Mainnet
  chain_id: 43114
  rpc_url: "https://api.avax.network/ext/bc/C/rpc"

ic:
  network: "ic"
  canisters:
    # TODO: Set after deployment
    ic_siwa_provider: ""

security:
  # Allowed domains for SIWA messages (user sees this in their wallet)
  allowed_domains:
    # Primary domains
    - "irkenempire.tech"
    - "*.irkenempire.tech"
    # Game domains
    - "tresr.community"
    - "*.tresr.community"

  # Allowed canisters for inter-canister calls
  # TODO: Add canister IDs after deployment
  allowed_canisters: []

  # Delegation targets - canisters that delegations are valid for
  # TODO: Add your Juno Satellite and other app canister IDs after deployment
  # If empty, delegations work for any canister (less secure)
  delegation_targets: []

  # Rate limiting to prevent cycle drain (stricter for mainnet)
  rate_limits:
    # Max prepare_login calls per address per window
    max_logins_per_address: 5
    # Max total prepare_login calls per window (across all addresses)
    max_logins_total: 100
    # Time window in seconds for rate limiting
    window_seconds: 3600

  # 30 minute sessions
  session_expiration_seconds: 1800
  # 5 minute login window
  login_expiration_seconds: 300

library:
  timeout_ms: 30000

# Debug mode
debug: false

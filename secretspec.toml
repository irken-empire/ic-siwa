[project]

name = "ic-siwa"
revision = "1.0"

[default]

# No provider defined here.
# Will refer to ~/.config/secretspec/config.toml

[profiles]

[profiles.default]

# DaisyUI (for frontend development)
DAISYUI_LICENSE = { description = "DaisyUI license key", required = false }
DAISYUI_EMAIL = { description = "DaisyUI account email", required = false }

# GitHub Token (for CI/CD and MCP)
GITHUB_TOKEN = { description = "GitHub personal access token", required = false }

#########################
# IC-SIWA Configuration
#########################

# Development (Local DFX/Juno)
# Used for local development with dfx start or Juno emulator
IC_SIWA_SALT_DEVELOPMENT = { description = "Salt for principal derivation (development)", required = false, default = "dev-salt-only" }
IC_SIWA_DOMAIN_DEVELOPMENT = { description = "Domain for SIWA messages (development)", required = false, default = "localhost" }
IC_SIWA_URI_DEVELOPMENT = { description = "URI for SIWA messages (development)", required = false, default = "http://localhost:4943" }

# Testnet (IC Mainnet with Avalanche Fuji)
# Used for testing on IC mainnet but with Avalanche Fuji testnet
IC_SIWA_SALT_TESTNET = { description = "Salt for principal derivation (testnet) - KEEP SECRET", required = false }
IC_SIWA_DOMAIN_TESTNET = { description = "Domain for SIWA messages (testnet)", required = false }
IC_SIWA_URI_TESTNET = { description = "URI for SIWA messages (testnet)", required = false }

# Mainnet (IC Mainnet with Avalanche Mainnet)
# Used for production deployments
IC_SIWA_SALT_MAINNET = { description = "Salt for principal derivation (mainnet) - KEEP SECRET", required = false }
IC_SIWA_DOMAIN_MAINNET = { description = "Domain for SIWA messages (mainnet)", required = false }
IC_SIWA_URI_MAINNET = { description = "URI for SIWA messages (mainnet)", required = false }

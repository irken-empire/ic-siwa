[workspace]
resolver = "2"
members = [
    "canisters/ic_siwa_provider",
    "canisters/test_canister_rs",
    "libs/ic_siwa",
]

[workspace.package]
version = "0.0.0"
authors = ["Irken Empire <dev@irkenempire.tech>"]
edition = "2021"
license = "Unlicense"
repository = "https://github.com/irken-empire/ic-siwa"
keywords = ["icp", "avalanche", "siwa", "authentication", "web3"]
categories = ["authentication", "cryptography", "wasm"]

[workspace.dependencies]
# Internet Computer
candid = "0.10"
ic-cdk = "0.19"
ic-cdk-macros = "0.19"
ic-cdk-timers = "1.0"
ic-stable-structures = "0.7"
ic-certified-map = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"

# Cryptography
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "ecdsa-core"] }
hex = "0.4"
getrandom = { version = "0.2", features = ["custom"] }

# Utilities
thiserror = "2.0"
time = "0.3"
simple_asn1 = "0.6"
serde_cbor = "0.11"

[profile.release]
lto = true
opt-level = "z"
